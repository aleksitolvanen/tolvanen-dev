<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa; --card: #fff; --ink: #16181d; --muted: #6b7280; --line: #e5e7eb;
    --accent: #1f6feb; --good: #15803d; --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#171a20; --ink:#e8eaed; --muted:#9aa3ad; --line:#252a32;
            --accent:#6ea8fe; --good:#4ade80; --warn:#fbbf24; }
  }
  :root[data-theme="light"] { --bg:#fbfbfa; --card:#fff; --ink:#16181d; --muted:#6b7280;
            --line:#e5e7eb; --accent:#1f6feb; --good:#15803d; --warn:#b45309; }
  :root[data-theme="dark"] { --bg:#0f1115; --card:#171a20; --ink:#e8eaed; --muted:#9aa3ad;
            --line:#252a32; --accent:#6ea8fe; --good:#4ade80; --warn:#fbbf24; }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 18px 64px; }

  header h1 { font-size: 25px; margin: 0 0 4px; letter-spacing: -.02em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .controls { display: flex; gap: 9px; flex-wrap: wrap; margin: 18px 0 20px;
              position: sticky; top: 0; z-index: 5; padding: 10px 0;
              background: linear-gradient(var(--bg) 78%, transparent); }
  input, select, button {
    font: inherit; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px;
  }
  #q { flex: 1 1 210px; min-width: 0; }
  button { cursor: pointer; }

  .grid { display: grid; gap: 15px;
          grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); }
  /* Phones get one disc per row: sleeve the full width of the screen, details beneath it. */
  @media (max-width: 560px) {
    .wrap { padding: 20px 13px 52px; }
    .grid { grid-template-columns: 1fr; gap: 18px; }
    .card { border-radius: 14px; }
    .artist { font-size: 16px; }
    .album { font-size: 15px; }
    .sub { font-size: 13px; }
    .meta { padding: 13px 15px 16px; gap: 3px; }
    .price b { font-size: 20px; }
  }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          overflow: hidden; display: flex; flex-direction: column; }
  .cover { position: relative; width: 100%; aspect-ratio: 1; background: var(--bg);
           border: 0; padding: 0; cursor: zoom-in; display: block; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .none { display: grid; place-items: center; height: 100%; color: var(--muted); font-size: 11px; }
  .meta { padding: 10px 11px 12px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .artist { font-weight: 620; font-size: 13.5px; line-height: 1.3; }
  .album { font-size: 13px; color: var(--muted); line-height: 1.3; }
  .sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .price { margin-top: auto; padding-top: 9px; display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .price b { font-size: 17px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .price s { color: var(--muted); font-size: 11.5px; text-decoration: none; }
  .hot { color: var(--warn); font-size: 11px; font-weight: 600; }

  /* compact list view — same data, no sleeves */
  .list { display: flex; flex-direction: column; background: var(--card);
          border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 1px 14px; width: 100%;
         padding: 10px 14px; border-top: 1px solid var(--line); align-items: center; }
  .row:first-child { border-top: 0; }
  .row:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  /* the title block opens the sleeve; the price is a link, so they cannot be one element */
  .rmain { display: grid; gap: 1px; padding: 0; border: 0; background: none;
           color: inherit; font: inherit; text-align: left; cursor: pointer; min-width: 0; }
  .rtitle { font-size: 14px; }
  .rtitle b { font-weight: 620; }
  .rtitle span { color: var(--muted); }
  .rsub { grid-column: 1; font-size: 11.5px; color: var(--muted); }
  .rprice { text-align: right; font-variant-numeric: tabular-nums; color: inherit;
            font-weight: 620; font-size: 15px; white-space: nowrap; text-decoration: none; }
  .rprice small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  a.rprice:hover, a.plink:hover { color: var(--accent); text-decoration: underline; }
  .plink { text-decoration: none; color: inherit; display: inline-flex;
           align-items: baseline; gap: 7px; flex-wrap: wrap; }
  @media (max-width: 560px) { .rtitle { font-size: 14.5px; } .row { padding: 11px 13px; } }

  #none { display: none; color: var(--muted); padding: 30px 0; }

  /* lightbox */
  #lb { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none;
        z-index: 50; touch-action: none; }
  #lb.open { display: grid; grid-template-rows: 1fr auto; }
  #lb img { max-width: 96vw; max-height: 100%; margin: auto; display: block;
            object-fit: contain; border-radius: 4px; }
  #lbcap { color: #e8eaed; text-align: center; padding: 14px 18px calc(18px + env(safe-area-inset-bottom));
           font-size: 13.5px; line-height: 1.5; }
  #lbcap b { display: block; font-size: 15px; }
  #lbcap a { color: #9ec5ff; }
  #lbx { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px;
         background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 50%;
         width: 42px; height: 42px; font-size: 21px; line-height: 1; cursor: pointer; }
  .navb { position: absolute; top: 50%; transform: translateY(-50%);
          background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 50%;
          width: 46px; height: 46px; font-size: 21px; cursor: pointer; }
  #lbprev { left: 10px; } #lbnext { right: 10px; }
  @media (max-width: 640px) { .navb { display: none; } }
  body.locked { overflow: hidden; }
</style>
</head>

<div class="wrap">
  <header>
    <h1>CD collection</h1>
    <p>Valued 2026-07-28 from Discogs sale history · tap a cover for the full sleeve</p>
  </header>

  <div class="controls">
    <input id="q" type="search" placeholder="Filter by artist, title, label, year…" autocomplete="off">

      <option value="year">Year: newest</option>
      <option value="yearold">Year: oldest</option>
      <option value="scarce">Most wanted</option>
    </select>
    <button id="view" title="Toggle covers">☰ List</button>
    <button id="theme" title="Toggle theme">◐</button>
  </div>

  <div class="grid" id="grid"></div>
  <p id="none">Nothing matches that filter.</p>
</div>

<div id="lb" role="dialog" aria-modal="true" aria-label="Cover art">
  <img id="lbimg" alt="">
  <div id="lbcap"></div>
  <button id="lbx" aria-label="Close">×</button>
  <button id="lbprev" class="navb" aria-label="Previous">‹</button>
  <button id="lbnext" class="navb" aria-label="Next">›</button>
</div>

const grid = document.getElementById('grid');
const q = document.getElementById('q');
const sortSel = document.getElementById('sort');
const eur = n => '€' + n.toFixed(2);
const viewBtn = document.getElementById('view');
let view = DISCS.slice();
let mode = localStorage.getItem('cdview') === 'list' ? 'list' : 'grid';

function render() {
  const term = q.value.trim().toLowerCase();
  let list = DISCS.filter(d => !term ||
    (d.artist + ' ' + d.title + ' ' + d.label + ' ' + d.catno + ' ' + d.year).toLowerCase().includes(term));

  // Unpriced discs sort last in both directions rather than pretending to be €0.
  const price = d => d.vgplus ?? d.asking;
  const by = sortSel.value;
  const name = (a, b, k) => (a[k] || '').localeCompare(b[k] || '', 'fi', {sensitivity: 'base'});
  list.sort((a, b) => {
    if (by === 'value') return (price(b) ?? -Infinity) - (price(a) ?? -Infinity);
    if (by === 'valueasc') return (price(a) ?? Infinity) - (price(b) ?? Infinity);
    if (by === 'album') return name(a, b, 'title') || name(a, b, 'artist');
    if (by === 'artistdesc') return name(b, a, 'artist') || name(a, b, 'title');
    if (by === 'year') return (b.year || 0) - (a.year || 0);
    if (by === 'yearold') return (a.year || 9999) - (b.year || 9999);
    if (by === 'scarce') return (b.ratio ?? -1) - (a.ratio ?? -1);
    return name(a, b, 'artist') || name(a, b, 'title');
  });

  view = list;
  document.getElementById('none').style.display = list.length ? 'none' : 'block';

  if (mode === 'list') {
    grid.className = 'list';
    grid.innerHTML = list.map((d, i) => {
      const sub = [d.year, d.country, d.label, d.catno].filter(Boolean).join(' · ');
      const p = d.vgplus ?? d.asking;
      const tag = d.vgplus != null ? '' : (d.asking != null ? '<small>asking</small>' : '');
      const body = `${p != null ? eur(p) : '—'}${tag}`;
      const price = d.discogs
        ? `<a class="rprice" href="${d.discogs}" target="_blank" rel="noopener"
             title="View on Discogs">${body}</a>`
        : `<span class="rprice">${body}</span>`;
      return `<div class="row">
        <button class="rmain" data-i="${i}">
          <span class="rtitle"><b>${esc(d.artist)}</b> <span>— ${esc(d.title)}</span></span>
          <span class="rsub">${esc(sub)}</span>
        </button>
        ${price}
      </div>`;
    }).join('');
    return;
  }

  grid.className = 'grid';
  grid.innerHTML = list.map((d, i) => {
    const sub = [d.year, d.country, d.format].filter(Boolean).join(' · ');
    const lab = [d.label, d.catno].filter(Boolean).join(' · ');
    // On phones the sleeve spans the whole screen, so the 150px thumb is far too small —
    // let the browser pick the full-size file there and keep the thumb for grid columns.
    const srcset = d.full && d.thumb
      ? ` srcset="${d.thumb} 150w, ${d.full} ${d.fullw}w"`
        + ` sizes="(max-width: 560px) 100vw, (max-width: 900px) 33vw, 220px"`
      : '';
    const cover = (d.thumb || d.full)
      ? `<img src="${d.thumb || d.full}"${srcset} alt="" loading="lazy" decoding="async">`
      : `<div class="none">no cover</div>`;
    const body = d.vgplus != null
      ? `<b>${eur(d.vgplus)}</b>${d.asking != null && d.asking > d.vgplus * 1.25
          ? `<s>asking ${eur(d.asking)}</s>` : ''}`
      : (d.asking != null ? `<b>${eur(d.asking)}</b><s>asking</s>` : `<s>unpriced</s>`);
    const price = d.discogs
      ? `<a class="plink" href="${d.discogs}" target="_blank" rel="noopener"
           title="View on Discogs">${body}</a>`
      : body;
    const hot = d.cond
      ? `<span class="hot">${esc(d.cond)}</span>`
      : (d.ratio != null && d.ratio >= 0.9 ? `<span class="hot">in demand</span>` : '');
    return `<article class="card">
      <button class="cover" data-i="${i}" aria-label="Show cover of ${esc(d.title)}">${cover}</button>
      <div class="meta">
        <div class="artist">${esc(d.artist)}</div>
        <div class="album">${esc(d.title)}</div>
        <div class="sub">${esc(sub)}</div>
        <div class="sub">${esc(lab)}</div>
        <div class="price">${price}${hot}</div>
      </div>
    </article>`;
  }).join('');
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* ---- lightbox ---- */
const lb = document.getElementById('lb');
const lbimg = document.getElementById('lbimg');
const lbcap = document.getElementById('lbcap');
let idx = 0;

function openLb(i) {
  idx = i;
  const d = view[idx];
  if (!d) return;
  lbimg.src = d.full || d.thumb || '';
  lbimg.alt = `${d.artist} — ${d.title}`;
  const bits = [d.year, d.country, d.format, d.label, d.catno].filter(Boolean).join(' · ');
  const links = [
    d.discogs ? `<a href="${d.discogs}" target="_blank" rel="noopener">Discogs</a>` : '',
    d.mbid ? `<a href="https://musicbrainz.org/release/${d.mbid}" target="_blank" rel="noopener">MusicBrainz</a>` : '',
  ].filter(Boolean).join(' · ');
  lbcap.innerHTML = `<b>${esc(d.artist)} — ${esc(d.title)}</b>${esc(bits)}<br>${links}`;
  lb.classList.add('open');
  document.body.classList.add('locked');
}
function closeLb() { lb.classList.remove('open'); document.body.classList.remove('locked'); lbimg.src = ''; }
function step(n) { openLb((idx + n + view.length) % view.length); }

grid.addEventListener('click', e => {
  const btn = e.target.closest('.cover, .rmain');
  if (btn) openLb(+btn.dataset.i);
});
document.getElementById('lbx').addEventListener('click', closeLb);
document.getElementById('lbprev').addEventListener('click', e => { e.stopPropagation(); step(-1); });
document.getElementById('lbnext').addEventListener('click', e => { e.stopPropagation(); step(1); });
lb.addEventListener('click', e => { if (e.target === lb || e.target === lbimg) closeLb(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});

// Swipe to move between covers, drag-down to dismiss — the phone equivalent of the arrows.
let sx = 0, sy = 0;
lb.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive: true});
lb.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
  else if (dy > 85) closeLb();
}, {passive: true});

/* ---- theme ---- */
document.getElementById('theme').addEventListener('click', () => {
  const now = document.documentElement.getAttribute('data-theme');
  const dark = now ? now === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
});

function syncView() {
  viewBtn.textContent = mode === 'list' ? '▦ Covers' : '☰ List';
  localStorage.setItem('cdview', mode);
}
viewBtn.addEventListener('click', () => {
  mode = mode === 'list' ? 'grid' : 'list';
  syncView();
  render();
});

q.addEventListener('input', render);
sortSel.addEventListener('change', render);
syncView();
render();
</script>
