<style>
/* ---------------------------------------------------------------------------
   THEME. build-festival.py replaces the region between the sentinels with the
   tokens it derived from spec.theme, for light and dark.

   Keep the sentinel comments EXACTLY as they are or --rebuild cannot find them.
   Do not restyle a single event by editing anything below the theme region: the
   mobile and contrast guarantees live in this file and every future page
   inherits them.
   --------------------------------------------------------------------------- */
/* @al-festival:theme:begin */
:root, :root[data-theme="light"] {
  --bg: #e9e9ea; --surface: #fafafa; --surface-2: #dedee0; --surface-3: #d0d0d3;
  --ink: #0f1011; --ink-2: #45474a; --ink-3: #686b6e;
  --line: #cdcdd0; --line-2: #b0b1b4;
  --accent: #c8102e; --accent-soft: #e5cfd3; --accent-ink: #ffffff; --accent-text: #c8102e;
}
@media (prefers-color-scheme: dark) {
  :root {
  --bg: #08090a; --surface: #111213; --surface-2: #191b1c; --surface-3: #232527;
  --ink: #f0f1f2; --ink-2: #a9acaf; --ink-3: #7e8184;
  --line: #1e2022; --line-2: #2e3134;
  --accent: #c8102e; --accent-soft: #270a10; --accent-ink: #ffffff; --accent-text: #d4455c;
  }
}
:root[data-theme="dark"] {
  --bg: #08090a; --surface: #111213; --surface-2: #191b1c; --surface-3: #232527;
  --ink: #f0f1f2; --ink-2: #a9acaf; --ink-3: #7e8184;
  --line: #1e2022; --line-2: #2e3134;
  --accent: #c8102e; --accent-soft: #270a10; --accent-ink: #ffffff; --accent-text: #d4455c;
}
:root {
  --display: "Archivo Narrow", "Roboto Condensed", "Liberation Sans Narrow", "Arial Narrow", Impact, system-ui, sans-serif;
}
/* @al-festival:theme:end */

:root {
  --radius: 3px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --tap: 44px;
}

* { box-sizing: border-box; }
html { color-scheme: light dark; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-wrap: break-word;
}
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding: 0 max(14px, env(safe-area-inset-left)) 80px max(14px, env(safe-area-inset-right));
}
a { color: var(--accent-text); }
button { font: inherit; color: inherit; }

@media (prefers-reduced-motion: no-preference) {
  .card, .chip, .plbtn, .lnk, .detbtn { transition: border-color .12s ease, background .12s ease; }
}
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }

/* ---- masthead ---------------------------------------------------------- */
.mast { padding: 26px 0 16px; border-bottom: 2px solid var(--ink); }
.mast.grad {
  margin: 0 calc(-1 * max(14px, env(safe-area-inset-left))) 0 calc(-1 * max(14px, env(safe-area-inset-right)));
  padding: 26px max(14px, env(safe-area-inset-left)) 16px;
  background: linear-gradient(160deg, var(--accent-soft), transparent 70%);
}
.mast.bars { position: relative; }
.mast.bars::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px;
  background: repeating-linear-gradient(90deg, var(--accent) 0 22px, transparent 22px 34px);
}
.mast.bars { padding-top: 32px; }
.eyebrow {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--accent-text); margin: 0 0 8px;
}
h1 {
  font-family: var(--display);
  font-size: clamp(27px, 8vw, 44px); line-height: 1.08; margin: 0 0 8px;
  letter-spacing: -.02em; text-wrap: balance;
}
.sub { margin: 0; color: var(--ink-2); font-size: 14px; }
/* The official schedule belongs at the top, not only in the footer: this page is a
   copy of a lineup that can change, and the reader should be one tap from the
   source without scrolling past 32 acts to find it. */
.src { margin: 4px 0 0; font-size: 13.5px; }
.src a { text-decoration: underline; text-underline-offset: 3px; }
.note {
  margin: 12px 0 0; padding: 9px 12px; font-size: 13.5px; color: var(--ink-2);
  background: var(--accent-soft); border-left: 3px solid var(--accent);
  border-radius: var(--radius);
}
.themebtn {
  margin-top: 14px; min-height: var(--tap); padding: 6px 14px;
  background: var(--surface); border: 1px solid var(--line-2);
  border-radius: var(--radius); font-family: var(--mono); font-size: 11px;
  letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
}

/* ---- playlists --------------------------------------------------------- */
.pl { margin: 20px 0 0; }
h2 {
  font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-2);
  margin: 26px 0 10px; padding-bottom: 7px; border-bottom: 1px solid var(--line);
}
/* Plain text links, not buttons. They still need to be comfortably tappable, so
   they carry vertical padding rather than a box: the hit area is ~34px without
   any of them looking like a control. */
.plrow { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; }
.plbtn {
  display: inline-block; padding: 8px 0;
  color: var(--accent-text); font-weight: 600; font-size: 15px;
  text-decoration: underline; text-underline-offset: 3px;
}
.plbtn .n { font-family: var(--mono); font-size: 11.5px; opacity: .75; margin-left: 3px; }
.plhint { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-3); }

/* ---- controls ---------------------------------------------------------- */
.controls {
  position: sticky; top: 0; z-index: 20;
  margin: 16px 0 2px; padding: 8px 0 6px;
  background: linear-gradient(var(--bg) 82%, transparent);
}
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
/* Compact on purpose. At 44 px in a wrapping row these seven chips occupied 288 px
   of a 360 px-wide screen -- most of a phone viewport spent on filters before a
   single act was visible. They are a secondary control on a page whose point is
   the list, so they trade tap size for the space. */
.chip {
  min-height: 30px; padding: 3px 10px;
  background: var(--surface); border: 1px solid var(--line-2);
  border-radius: 999px; font-size: 12.5px; line-height: 1.35;
  cursor: pointer; white-space: nowrap;
}
.chip[aria-pressed="true"] {
  background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600;
}
.srchwrap { position: relative; margin-top: 6px; }
.srch {
  width: 100%; min-height: 36px; padding: 7px 38px 7px 11px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line-2); border-radius: var(--radius); font-size: 16px;
}
/* 16px, not 14: iOS Safari zooms the whole page when a focused input's text is
   under 16px, and the zoom does not come back on blur. */
.srch::-webkit-search-cancel-button { display: none; }
.srchx {
  position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; padding: 0; cursor: pointer;
  background: none; border: 0; color: var(--ink-2); font-size: 20px; line-height: 1;
}
.srchx:hover { color: var(--ink); }
.count { margin: 4px 0 0; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
         letter-spacing: .06em; text-transform: uppercase; }

/* ---- act cards --------------------------------------------------------- */
.acts { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-left: 3px solid var(--accent); border-radius: var(--radius);
  padding: 13px 14px;
}
.chead { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; min-width: 0; }
.ord {
  font-family: var(--mono); font-size: 11px; color: var(--accent-ink);
  background: var(--accent); border-radius: var(--radius);
  padding: 2px 6px; flex: none;
}
/* min-width:0 plus break-anywhere on every flex child that holds researched text.
   A flex item will not shrink below the width of its content, so one long
   unbreakable string -- a song title with no spaces, a band name written as one
   word -- pushes the whole page into horizontal scroll at 360px. The default
   overflow-wrap on body does not reach inside a flex item without this. */
.aname {
  font-family: var(--display); font-size: 21px; line-height: 1.15; margin: 0;
  letter-spacing: -.01em; min-width: 0; overflow-wrap: anywhere;
}
.slot { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); letter-spacing: .04em; }
.gen { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 0; }
.tag {
  font-size: 11.5px; padding: 2px 8px; color: var(--ink-2);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
}
.blurb { margin: 7px 0 0; color: var(--ink-2); font-size: 14.5px; }
.been { margin: 5px 0 0; color: var(--ink-3); font-size: 12.5px; }
.been b { font-weight: 600; color: var(--ink-3); }
.arow { display: flex; flex-wrap: wrap; gap: 2px 16px; align-items: baseline; margin: 6px 0 0; }
.detbtn, .ext {
  display: inline-block; padding: 7px 0; background: none; border: 0;
  font-size: 13.5px; cursor: pointer; color: var(--accent-text);
  text-decoration: underline; text-underline-offset: 3px;
}
.detbtn:hover, .ext:hover { color: var(--ink); }

/* ---- songs ------------------------------------------------------------- */
/* Two lines per song instead of five: title and its links on one row, then album,
   year and the reason on a single muted line under it. On a 32-act bill that is
   the difference between a page you can scan and one you scroll past. */
.songs { list-style: none; margin: 9px 0 0; padding: 0; border-top: 1px solid var(--line); }
.song { padding: 7px 0 8px; border-bottom: 1px solid var(--line); }
.song:last-child { border-bottom: 0; padding-bottom: 1px; }
/* space-between rather than margin-left:auto on .links: with one item per line
   after a wrap, auto-margin would shove the links to the right edge of their own
   line, which reads as a stray fragment. space-between leaves them left-aligned
   when wrapped and still pushes them right when they fit. */
.stitle {
  display: flex; gap: 2px 12px; align-items: baseline; flex-wrap: wrap;
  justify-content: space-between; min-width: 0;
}
/* The number and the title are one unit -- letting them break apart orphans a
   bare "5" on its own line above a long song title. */
.shead { display: flex; gap: 8px; align-items: baseline; min-width: 0; flex: 1 1 auto; }
.snum { font-family: var(--mono); font-size: 11px; color: var(--ink-3); flex: none; }
.sname { font-weight: 600; font-size: 14.5px; min-width: 0; overflow-wrap: anywhere; }
.links { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; flex: 0 0 auto; }
.lnk {
  display: inline-block; padding: 8px 0; font-size: 12.5px;
  color: var(--accent-text); text-decoration: underline; text-underline-offset: 3px;
}
.lnk:hover { color: var(--ink); }
.smeta { margin: 1px 0 0 20px; font-size: 12.5px; color: var(--ink-3); }

/* ---- dialog ------------------------------------------------------------ */
dialog {
  width: min(660px, 100vw); max-width: 100vw; max-height: 100dvh;
  margin: auto; padding: 0; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-2); border-radius: var(--radius);
}
dialog::backdrop { background: rgba(0,0,0,.6); }
.dhead {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: flex-start; gap: 10px;
  padding: 14px max(14px, env(safe-area-inset-right)) 12px 14px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.dhead h3 {
  font-family: var(--display); font-size: 22px; line-height: 1.15; margin: 0;
  flex: 1; min-width: 0; overflow-wrap: anywhere;
}
.dx {
  flex: none; width: var(--tap); height: var(--tap); cursor: pointer;
  font-size: 22px; line-height: 1; background: var(--surface-2);
  border: 1px solid var(--line-2); border-radius: var(--radius);
}
.dbody { padding: 14px; padding-bottom: max(18px, env(safe-area-inset-bottom)); }
.dmeta { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); margin: 0 0 10px; }
.dbody h4 {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3); margin: 18px 0 7px; padding-bottom: 5px; border-bottom: 1px solid var(--line);
}
.dbody p { margin: 0 0 10px; color: var(--ink-2); }
.dl { list-style: none; margin: 0; padding: 0; }
.dl li { padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.dl li:last-child { border-bottom: 0; }
.dl .r { color: var(--ink-3); font-size: 12.5px; }
.sl { margin: 0; padding-left: 22px; }
.sl li { padding: 3px 0; font-size: 14px; }
.sl .r { color: var(--ink-3); font-size: 12.5px; }
.slnote { margin: 8px 0 0; font-size: 12.5px; color: var(--ink-3); }
.yr { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }

@media (max-width: 560px) {
  dialog { width: 100vw; height: 100dvh; max-height: 100dvh; border: 0; border-radius: 0; }
}
@media (min-width: 620px) {
  .wrap { padding-left: 20px; padding-right: 20px; }
  .smeta, .swhy, .links { margin-left: 24px; }
}

footer {
  margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--line);
  color: var(--ink-3); font-size: 13px;
}
footer p { margin: 0 0 6px; }
.empty { padding: 30px 0; color: var(--ink-3); text-align: center; }
</style>
</head>

<div class="wrap">
  <header class="mast" id="mast">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <p class="src" id="src"></p>
    <div id="noteslot"></div>
    <button class="themebtn" id="themebtn" type="button">Theme</button>
  </header>

  <section class="pl" id="plsec" hidden>
    <h2 id="plhead">Playlists</h2>
    <div class="plrow" id="plrow"></div>
    <p class="plhint" id="plhint"></p>
  </section>

  <h2>Lineup</h2>
  <div class="controls">
    <div class="chips" id="chips"></div>
    <!-- A real <form> is what makes the mobile keyboard's Enter/Go key dismissable:
         with a bare input there is nothing to submit, so the key does nothing and
         the keyboard will not go away. -->
    <form class="srchwrap" id="srchform" role="search" action="#" onsubmit="return false">
      <input class="srch" id="srch" type="search" enterkeyhint="done"
             autocapitalize="none" autocorrect="off" spellcheck="false"
             placeholder="Filter by name or genre" aria-label="Filter by name or genre">
      <button class="srchx" id="srchx" type="button" aria-label="Clear filter" hidden>&times;</button>
    </form>
    <p class="count" id="count"></p>
  </div>

  <div class="acts" id="acts"></div>

  <footer>
    <p id="prov"></p>
    <p>Act descriptions, line-ups and discographies come from web research and may contain errors.
       Song picks are an introduction to each act, not a ranking.</p>
  </footer>
</div>

<dialog id="dlg" aria-labelledby="dlgtitle">
  <div class="dhead">
    <h3 id="dlgtitle"></h3>
    <button class="dx" id="dlgx" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="dbody" id="dlgbody"></div>
</dialog>

       catalogue gets fewer than five, and a heading that claims otherwise is wrong
       on exactly the acts a reader is least sure about. */
    var counts = acts.map(function (a) { return (a.songs || []).length; });
    var hi = Math.max.apply(null, counts.concat([0]));
    var uniform = counts.length && counts.every(function (n) { return n === hi; });
    $("plhead").textContent = "YouTube playlists — " + (uniform ? "" : "up to ") + hi
      + " songs per act, in performance order";

    $("plrow").innerHTML = pls.map(function (p) {
      return "<a class=\"plbtn\" href=\"" + attr(p.url) + "\" target=\"_blank\" rel=\"noopener\">"
        + esc(p.platform) + (p.of > 1 ? " <span class=\"n\">" + p.n + "/" + p.of + "</span>" : "")
        + "</a>";
    }).join("");

    var chunked = pls.some(function (p) { return p.of > 1; });
    $("plhint").textContent =
      (chunked ? "Split into parts because one playlist link holds 50 videos; no act is split "
               + "across parts. " : "")
      + "Every song also has its own YouTube Music link below.";
  }

  /* ---- filters -------------------------------------------------------- */
  var KEY = "alfest:" + (CONFIG.slug || "x") + ":filters";
  var state = { day: "all", stage: "all", q: "" };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved) {
      if (saved.day) { state.day = saved.day; }
      if (saved.stage) { state.stage = saved.stage; }
    }
  } catch (e) { /* file:// with storage disabled; defaults are fine */ }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ day: state.day, stage: state.stage })); }
    catch (e) { /* not worth telling the reader about */ }
  }

  var groups = [];
  if ((DATA.days || []).length > 1) {
    groups.push({ kind: "day", items: DATA.days });
  }
  if ((DATA.stages || []).length > 1) {
    groups.push({ kind: "stage", items: DATA.stages });
  }

  function renderChips() {
    var html = "";
    groups.forEach(function (g) {
      html += "<button class=\"chip\" type=\"button\" data-kind=\"" + g.kind
        + "\" data-v=\"all\" aria-pressed=\"" + (state[g.kind] === "all") + "\">"
        + (g.kind === "day" ? "All days" : "All stages") + "</button>";
      g.items.forEach(function (it) {
        html += "<button class=\"chip\" type=\"button\" data-kind=\"" + g.kind
          + "\" data-v=\"" + attr(it.id) + "\" aria-pressed=\"" + (state[g.kind] === it.id)
          + "\">" + esc(it.label) + "</button>";
      });
    });
    $("chips").innerHTML = html;
  }

  $("chips").addEventListener("click", function (e) {
    var b = e.target.closest("button.chip");
    if (!b) { return; }
    state[b.getAttribute("data-kind")] = b.getAttribute("data-v");
    save();
    renderChips();
    render();
  });

  var srch = $("srch"), srchx = $("srchx");

  function applyQuery() {
    state.q = srch.value.trim().toLowerCase();
    srchx.hidden = !srch.value;
    render();
  }

  srch.addEventListener("input", applyQuery);

  /* Three separate ways to put the keyboard away, because on a phone a filter you
     cannot dismiss is worse than no filter: the form's Enter/Go key, the clear
     button, and Escape. */
  $("srchform").addEventListener("submit", function (e) {
    e.preventDefault();
    srch.blur();
  });
  srch.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); srch.blur(); }
    if (e.key === "Escape") { srch.value = ""; applyQuery(); srch.blur(); }
  });
  srchx.addEventListener("click", function () {
    srch.value = "";
    applyQuery();
    srch.blur();
  });

  function matches(a) {
    if (state.day !== "all" && a.day !== state.day) { return false; }
    if (state.stage !== "all" && a.stage !== state.stage) { return false; }
    if (state.q) {
      var hay = (a.name + " " + (a.genres || []).join(" ") + " " + (a.origin || "")).toLowerCase();
      if (hay.indexOf(state.q) === -1) { return false; }
    }
    return true;
  }

  /* ---- act cards ------------------------------------------------------ */
  function songHtml(s, i) {
    /* Album, year and the reason share one muted line -- three stacked paragraphs
       per song is what made a 32-act page unscrollable. */
    var meta = [];
    if (s.album) { meta.push(s.album); }
    if (s.year) { meta.push(s.year); }
    var line = meta.join(" · ");
    if (s.why) { line = line ? line + " — " + s.why : s.why; }

    var links = [];
    if (s.yt_audio) {
      links.push("<a class=\"lnk\" target=\"_blank\" rel=\"noopener\" href=\"https://music.youtube.com/watch?v="
        + attr(s.yt_audio) + "\">YT Music</a>");
      links.push("<a class=\"lnk\" target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v="
        + attr(s.yt_audio) + "\">YouTube</a>");
    }
    if (s.yt_video) {
      links.push("<a class=\"lnk\" target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v="
        + attr(s.yt_video) + "\">Video</a>");
    }

    return "<li class=\"song\">"
      + "<div class=\"stitle\"><span class=\"shead\"><span class=\"snum\">" + (i + 1)
      + "</span><span class=\"sname\">" + esc(s.title) + "</span></span>"
      + (links.length ? "<span class=\"links\">" + links.join("") + "</span>" : "")
      + "</div>"
      + (line ? "<p class=\"smeta\">" + esc(line) + "</p>" : "")
      + "</li>";
  }

  function cardHtml(a) {
    var slot = [];
    if (a.time) { slot.push(a.time + (a.until ? "–" + a.until : "")); }
    if (dayLabel[a.day] && (DATA.days || []).length > 1) { slot.push(dayLabel[a.day]); }
    if (stageLabel[a.stage]) { slot.push(stageLabel[a.stage]); }

    /* Somewhere to listen, then Wikipedia, then the official site: listen, read,
       then the band's own page. Wikipedia is on the card and not only in the
       dialog because it is the link most often actually wanted -- someone
       scanning a lineup wants one tap to "who are these people", without opening
       a popup first. Both places carry it; neither is a substitute for the other.

       SoundCloud and Mixcloud sit in the listen group beside Spotify because a
       DJ bill is full of acts with no records at all: their music exists only as
       recorded mixes, and those hosts are the only place it lives. A card with
       nothing to play is the worst card this page produces, so an act that
       cannot offer five songs should at least offer one link. */
    var ext = [], ls0 = a.links || {};
    if (ls0.yt_music) {
      ext.push("<a class=\"ext\" target=\"_blank\" rel=\"noopener\" href=\""
        + attr(ls0.yt_music) + "\">YT Music</a>");
    }
    if (ls0.spotify) {
      ext.push("<a class=\"ext\" target=\"_blank\" rel=\"noopener\" href=\""
        + attr(ls0.spotify) + "\">Spotify</a>");
    }
    if (ls0.soundcloud) {
      ext.push("<a class=\"ext\" target=\"_blank\" rel=\"noopener\" href=\""
        + attr(ls0.soundcloud) + "\">SoundCloud</a>");
    }
    if (ls0.mixcloud) {
      ext.push("<a class=\"ext\" target=\"_blank\" rel=\"noopener\" href=\""
        + attr(ls0.mixcloud) + "\">Mixcloud</a>");
    }
    if (ls0.wikipedia) {
      ext.push("<a class=\"ext\" target=\"_blank\" rel=\"noopener\" href=\""
        + attr(ls0.wikipedia) + "\">" + wikiLabel(ls0.wikipedia) + "</a>");
    }
    if (ls0.official) {
      ext.push("<a class=\"ext\" target=\"_blank\" rel=\"noopener\" href=\""
        + attr(ls0.official) + "\">Site</a>");
    }

    var hasDetail = a.detail || (a.members || []).length || (a.albums || []).length;

    return "<article class=\"card\" id=\"act-" + attr(a.id) + "\">"
      + "<div class=\"chead\"><span class=\"ord\">" + esc(a.order) + "</span>"
      + "<h3 class=\"aname\">" + esc(a.name) + "</h3>"
      + (slot.length ? "<span class=\"slot\">" + esc(slot.join(" · ")) + "</span>" : "")
      + "</div>"
      + ((a.genres || []).length
          ? "<div class=\"gen\">" + a.genres.map(function (g) {
              return "<span class=\"tag\">" + esc(g) + "</span>"; }).join("") + "</div>"
          : "")
      + (a.blurb ? "<p class=\"blurb\">" + esc(a.blurb) + "</p>" : "")
      + (a.also_played
          ? "<p class=\"been\"><b>Played here before:</b> " + esc(a.also_played) + "</p>" : "")
      + "<div class=\"arow\">"
      + (hasDetail ? "<button class=\"detbtn\" type=\"button\" data-act=\"" + attr(a.id)
          + "\">Members &amp; releases</button>" : "")
      + ext.join("")
      + "</div>"
      + ((a.songs || []).length
          ? "<ul class=\"songs\">" + a.songs.map(songHtml).join("") + "</ul>" : "")
      + "</article>";
  }

  function render() {
    var vis = acts.filter(matches);
    $("acts").innerHTML = vis.length
      ? vis.map(cardHtml).join("")
      : "<p class=\"empty\">No acts match that filter.</p>";
    var n = 0;
    vis.forEach(function (a) { n += (a.songs || []).length; });
    $("count").textContent = vis.length === acts.length
      ? acts.length + " acts"
      : "showing " + vis.length + " of " + acts.length + " acts · " + n + " songs";
  }

  /* ---- dialog --------------------------------------------------------- */
  var dlg = $("dlg"), scrollY = 0;

  function lockScroll() {
    /* Compensate for the scrollbar the lock removes, or the page shifts sideways
       under the backdrop on desktop. */
    var pad = window.innerWidth - document.documentElement.clientWidth;
    scrollY = window.scrollY;
    document.body.style.overflow = "hidden";
    if (pad > 0) { document.body.style.paddingRight = pad + "px"; }
  }
  function unlockScroll() {
    document.body.style.overflow = "";
    document.body.style.paddingRight = "";
  }

  function listHtml(items, fmt) {
    return "<ul class=\"dl\">" + items.map(fmt).join("") + "</ul>";
  }

  function openAct(id) {
    var a = byId[id];
    if (!a) { return; }
    $("dlgtitle").textContent = a.name;

    var meta = [];
    if (a.origin) { meta.push(a.origin); }
    if (a.formed) { meta.push("formed " + a.formed); }
    if ((a.genres || []).length) { meta.push(a.genres.join(", ")); }

    var html = "";
    if (meta.length) { html += "<p class=\"dmeta\">" + esc(meta.join(" · ")) + "</p>"; }
    if (a.detail) { html += "<p>" + esc(a.detail) + "</p>"; }

    if ((a.members || []).length) {
      html += "<h4>Line-up</h4>" + listHtml(a.members, function (m) {
        return "<li>" + esc(m.name)
          + (m.role ? " <span class=\"r\">" + esc(m.role)
              + (m.since ? ", since " + esc(m.since) : "") + "</span>" : "")
          + "</li>";
      });
    }
    if ((a.albums || []).length) {
      html += "<h4>Key releases</h4>" + listHtml(a.albums, function (r) {
        return "<li>" + esc(r.title)
          + (r.year ? " <span class=\"yr\">" + esc(r.year) + "</span>" : "")
          + (r.note ? "<br><span class=\"r\">" + esc(r.note) + "</span>" : "")
          + "</li>";
      });
    }

    /* A likely setlist is a prediction, so it is labelled as one and always shows
       what it was derived from. Without the "based on N shows" line it reads as
       something the festival announced, which it is not. */
    var sl = a.setlist;
    if (sl && (sl.songs || []).length) {
      html += "<h4>Likely setlist</h4>"
        + "<ol class=\"sl\">" + sl.songs.map(function (s) {
            return "<li>" + esc(typeof s === "string" ? s : s.title)
              + (typeof s !== "string" && s.note
                  ? " <span class=\"r\">" + esc(s.note) + "</span>" : "")
              + "</li>";
          }).join("") + "</ol>"
        + "<p class=\"slnote\">Guess, from recent shows"
        + (sl.based_on ? " — " + esc(sl.based_on) : "")
        + (sl.source ? " · <a href=\"" + attr(sl.source) + "\" target=\"_blank\" "
            + "rel=\"noopener\">setlist.fm</a>" : "")
        + (sl.note ? "<br>" + esc(sl.note) : "")
        + "</p>";
    }

    var ls = a.links || {}, ln = [];
    [["official", "Official site"], ["wikipedia", null], ["yt_music", "YouTube Music"],
     ["spotify", "Spotify"], ["bandcamp", "Bandcamp"], ["soundcloud", "SoundCloud"],
     ["mixcloud", "Mixcloud"]].forEach(function (p) {
      if (ls[p[0]]) {
        ln.push("<a class=\"ext\" target=\"_blank\" rel=\"noopener\" href=\""
          + attr(ls[p[0]]) + "\">" + (p[1] || wikiLabel(ls[p[0]])) + "</a>");
      }
    });
    if (ln.length) { html += "<h4>Links</h4><div class=\"arow\">" + ln.join("") + "</div>"; }

    $("dlgbody").innerHTML = html;
    lockScroll();
    dlg.showModal();
    $("dlgbody").scrollTop = 0;
  }

  $("acts").addEventListener("click", function (e) {
    var b = e.target.closest("button.detbtn");
    if (b) { openAct(b.getAttribute("data-act")); }
  });
  $("dlgx").addEventListener("click", function () { dlg.close(); });
  dlg.addEventListener("click", function (e) {
    /* The backdrop is the dialog element itself; a click on a child bubbles here
       with a different target. */
    if (e.target === dlg) { dlg.close(); }
  });
  dlg.addEventListener("close", function () {
    unlockScroll();
    window.scrollTo(0, scrollY);
  });

  /* ---- theme ---------------------------------------------------------- */
  var btn = $("themebtn");
  btn.addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var next = cur === "dark" ? "light" : cur === "light" ? "" : "dark";
    if (next) { document.documentElement.setAttribute("data-theme", next); }
    else { document.documentElement.removeAttribute("data-theme"); }
    btn.textContent = next ? "Theme: " + next : "Theme";
  });

  renderChips();
  render();
})();
</script>
</body>
</html>
