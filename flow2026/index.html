<style>
/* ---------------------------------------------------------------------------
   THEME. build-festival.py replaces the region between the sentinels with the
   tokens it derived from spec.theme, for light and dark.

   Keep the sentinel comments EXACTLY as they are or --rebuild cannot find them.
   Do not restyle a single event by editing anything below the theme region: the
   mobile and contrast guarantees live in this file and every future page
   inherits them.
   --------------------------------------------------------------------------- */
/* @al-festival:theme:begin */
:root, :root[data-theme="light"] {
  --bg: #edeef1; --surface: #fbfbfc; --surface-2: #e3e6ea; --surface-3: #d6dae0;
  --ink: #14181f; --ink-2: #4b535d; --ink-3: #6e7781;
  --line: #d2d7dd; --line-2: #b6bec7;
  --accent: #e6007e; --accent-soft: #ecd1e3; --accent-ink: #ffffff; --accent-text: #d10073;
}
@media (prefers-color-scheme: dark) {
  :root {
  --bg: #0e1116; --surface: #161a20; --surface-2: #1d222a; --surface-3: #262d36;
  --ink: #e6eaef; --ink-2: #a3adb8; --ink-3: #79838e;
  --line: #232a33; --line-2: #333c47;
  --accent: #ff5cb8; --accent-soft: #351d30; --accent-ink: #111111; --accent-text: #ff5cb8;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a20; --surface-2: #1d222a; --surface-3: #262d36;
  --ink: #e6eaef; --ink-2: #a3adb8; --ink-3: #79838e;
  --line: #232a33; --line-2: #333c47;
  --accent: #ff5cb8; --accent-soft: #351d30; --accent-ink: #111111; --accent-text: #ff5cb8;
}
:root {
  --display: "Archivo Narrow", "Roboto Condensed", "Liberation Sans Narrow", "Arial Narrow", Impact, system-ui, sans-serif;
}
/* @al-festival:theme:end */

:root {
  --radius: 3px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --tap: 44px;
}

* { box-sizing: border-box; }
html { color-scheme: light dark; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-wrap: break-word;
}
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding: 0 max(14px, env(safe-area-inset-left)) 80px max(14px, env(safe-area-inset-right));
}
a { color: var(--accent-text); }
button { font: inherit; color: inherit; }

@media (prefers-reduced-motion: no-preference) {
  .card, .chip, .plbtn, .lnk, .detbtn { transition: border-color .12s ease, background .12s ease; }
}
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }

/* ---- masthead ---------------------------------------------------------- */
.mast { padding: 26px 0 16px; border-bottom: 2px solid var(--ink); }
.mast.grad {
  margin: 0 calc(-1 * max(14px, env(safe-area-inset-left))) 0 calc(-1 * max(14px, env(safe-area-inset-right)));
  padding: 26px max(14px, env(safe-area-inset-left)) 16px;
  background: linear-gradient(160deg, var(--accent-soft), transparent 70%);
}
.mast.bars { position: relative; }
.mast.bars::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px;
  background: repeating-linear-gradient(90deg, var(--accent) 0 22px, transparent 22px 34px);
}
.mast.bars { padding-top: 32px; }
.eyebrow {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--accent-text); margin: 0 0 8px;
}
h1 {
  font-family: var(--display);
  font-size: clamp(27px, 8vw, 44px); line-height: 1.08; margin: 0 0 8px;
  letter-spacing: -.02em; text-wrap: balance;
}
.sub { margin: 0; color: var(--ink-2); font-size: 14px; }
/* The official schedule belongs at the top, not only in the footer: this page is a
   copy of a lineup that can change, and the reader should be one tap from the
   source without scrolling past 32 acts to find it. */
.src { margin: 4px 0 0; font-size: 13.5px; }
.src a { text-decoration: underline; text-underline-offset: 3px; }
.note {
  margin: 12px 0 0; padding: 9px 12px; font-size: 13.5px; color: var(--ink-2);
  background: var(--accent-soft); border-left: 3px solid var(--accent);
  border-radius: var(--radius);
}
.themebtn {
  margin-top: 14px; min-height: var(--tap); padding: 6px 14px;
  background: var(--surface); border: 1px solid var(--line-2);
  border-radius: var(--radius); font-family: var(--mono); font-size: 11px;
  letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
}

/* ---- playlists --------------------------------------------------------- */
.pl { margin: 20px 0 0; }
h2 {
  font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-2);
  margin: 26px 0 10px; padding-bottom: 7px; border-bottom: 1px solid var(--line);
}
/* Plain text links, not buttons. They still need to be comfortably tappable, so
   they carry vertical padding rather than a box: the hit area is ~34px without
   any of them looking like a control. */
.plrow { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; }
.plbtn {
  display: inline-block; padding: 8px 0;
  color: var(--accent-text); font-weight: 600; font-size: 15px;
  text-decoration: underline; text-underline-offset: 3px;
}
.plbtn .n { font-family: var(--mono); font-size: 11.5px; opacity: .75; margin-left: 3px; }
.plhint { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-3); }

/* ---- controls ---------------------------------------------------------- */
.controls {
  position: sticky; top: 0; z-index: 20;
  margin: 16px 0 2px; padding: 8px 0 6px;
  background: linear-gradient(var(--bg) 82%, transparent);
}
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
/* Compact on purpose. At 44 px in a wrapping row these seven chips occupied 288 px
   of a 360 px-wide screen -- most of a phone viewport spent on filters before a
   single act was visible. They are a secondary control on a page whose point is
   the list, so they trade tap size for the space. */
.chip {
  min-height: 30px; padding: 3px 10px;
  background: var(--surface); border: 1px solid var(--line-2);
  border-radius: 999px; font-size: 12.5px; line-height: 1.35;
  cursor: pointer; white-space: nowrap;
}
.chip[aria-pressed="true"] {
  background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600;
}
.srchwrap { position: relative; margin-top: 6px; }
.srch {
  width: 100%; min-height: 36px; padding: 7px 38px 7px 11px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line-2); border-radius: var(--radius); font-size: 16px;
}
/* 16px, not 14: iOS Safari zooms the whole page when a focused input's text is
   under 16px, and the zoom does not come back on blur. */
.srch::-webkit-search-cancel-button { display: none; }
.srchx {
  position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; padding: 0; cursor: pointer;
  background: none; border: 0; color: var(--ink-2); font-size: 20px; line-height: 1;
}
.srchx:hover { color: var(--ink); }
.count { margin: 4px 0 0; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
         letter-spacing: .06em; text-transform: uppercase; }

/* ---- act cards --------------------------------------------------------- */
.acts { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-left: 3px solid var(--accent); border-radius: var(--radius);
  padding: 13px 14px;
}
.chead { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; min-width: 0; }
.ord {
  font-family: var(--mono); font-size: 11px; color: var(--accent-ink);
  background: var(--accent); border-radius: var(--radius);
  padding: 2px 6px; flex: none;
}
/* min-width:0 plus break-anywhere on every flex child that holds researched text.
   A flex item will not shrink below the width of its content, so one long
   unbreakable string -- a song title with no spaces, a band name written as one
   word -- pushes the whole page into horizontal scroll at 360px. The default
   overflow-wrap on body does not reach inside a flex item without this. */
.aname {
  font-family: var(--display); font-size: 21px; line-height: 1.15; margin: 0;
  letter-spacing: -.01em; min-width: 0; overflow-wrap: anywhere;
}
.slot { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); letter-spacing: .04em; }
.gen { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 0; }
.tag {
  font-size: 11.5px; padding: 2px 8px; color: var(--ink-2);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
}
.blurb { margin: 7px 0 0; color: var(--ink-2); font-size: 14.5px; }
.arow { display: flex; flex-wrap: wrap; gap: 2px 16px; align-items: baseline; margin: 6px 0 0; }
.detbtn, .ext {
  display: inline-block; padding: 7px 0; background: none; border: 0;
  font-size: 13.5px; cursor: pointer; color: var(--accent-text);
  text-decoration: underline; text-underline-offset: 3px;
}
.detbtn:hover, .ext:hover { color: var(--ink); }

/* ---- songs ------------------------------------------------------------- */
/* Two lines per song instead of five: title and its links on one row, then album,
   year and the reason on a single muted line under it. On a 32-act bill that is
   the difference between a page you can scan and one you scroll past. */
.songs { list-style: none; margin: 9px 0 0; padding: 0; border-top: 1px solid var(--line); }
.song { padding: 7px 0 8px; border-bottom: 1px solid var(--line); }
.song:last-child { border-bottom: 0; padding-bottom: 1px; }
/* space-between rather than margin-left:auto on .links: with one item per line
   after a wrap, auto-margin would shove the links to the right edge of their own
   line, which reads as a stray fragment. space-between leaves them left-aligned
   when wrapped and still pushes them right when they fit. */
.stitle {
  display: flex; gap: 2px 12px; align-items: baseline; flex-wrap: wrap;
  justify-content: space-between; min-width: 0;
}
/* The number and the title are one unit -- letting them break apart orphans a
   bare "5" on its own line above a long song title. */
.shead { display: flex; gap: 8px; align-items: baseline; min-width: 0; flex: 1 1 auto; }
.snum { font-family: var(--mono); font-size: 11px; color: var(--ink-3); flex: none; }
.sname { font-weight: 600; font-size: 14.5px; min-width: 0; overflow-wrap: anywhere; }
.links { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; flex: 0 0 auto; }
.lnk {
  display: inline-block; padding: 8px 0; font-size: 12.5px;
  color: var(--accent-text); text-decoration: underline; text-underline-offset: 3px;
}
.lnk:hover { color: var(--ink); }
.smeta { margin: 1px 0 0 20px; font-size: 12.5px; color: var(--ink-3); }

/* ---- dialog ------------------------------------------------------------ */
dialog {
  width: min(660px, 100vw); max-width: 100vw; max-height: 100dvh;
  margin: auto; padding: 0; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-2); border-radius: var(--radius);
}
dialog::backdrop { background: rgba(0,0,0,.6); }
.dhead {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: flex-start; gap: 10px;
  padding: 14px max(14px, env(safe-area-inset-right)) 12px 14px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.dhead h3 {
  font-family: var(--display); font-size: 22px; line-height: 1.15; margin: 0;
  flex: 1; min-width: 0; overflow-wrap: anywhere;
}
.dx {
  flex: none; width: var(--tap); height: var(--tap); cursor: pointer;
  font-size: 22px; line-height: 1; background: var(--surface-2);
  border: 1px solid var(--line-2); border-radius: var(--radius);
}
.dbody { padding: 14px; padding-bottom: max(18px, env(safe-area-inset-bottom)); }
.dmeta { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); margin: 0 0 10px; }
.dbody h4 {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3); margin: 18px 0 7px; padding-bottom: 5px; border-bottom: 1px solid var(--line);
}
.dbody p { margin: 0 0 10px; color: var(--ink-2); }
.dl { list-style: none; margin: 0; padding: 0; }
.dl li { padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.dl li:last-child { border-bottom: 0; }
.dl .r { color: var(--ink-3); font-size: 12.5px; }
.yr { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }

@media (max-width: 560px) {
  dialog { width: 100vw; height: 100dvh; max-height: 100dvh; border: 0; border-radius: 0; }
}
@media (min-width: 620px) {
  .wrap { padding-left: 20px; padding-right: 20px; }
  .smeta, .swhy, .links { margin-left: 24px; }
}

footer {
  margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--line);
  color: var(--ink-3); font-size: 13px;
}
footer p { margin: 0 0 6px; }
.empty { padding: 30px 0; color: var(--ink-3); text-align: center; }
</style>
</head>

<div class="wrap">
  <header class="mast" id="mast">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <p class="src" id="src"></p>
    <div id="noteslot"></div>
    <button class="themebtn" id="themebtn" type="button">Theme</button>
  </header>

  <section class="pl" id="plsec" hidden>
    <h2 id="plhead">Playlists</h2>
    <div class="plrow" id="plrow"></div>
    <p class="plhint" id="plhint"></p>
  </section>

  <h2>Lineup</h2>
  <div class="controls">
    <div class="chips" id="chips"></div>
    <!-- A real <form> is what makes the mobile keyboard's Enter/Go key dismissable:
         with a bare input there is nothing to submit, so the key does nothing and
         the keyboard will not go away. -->
    <form class="srchwrap" id="srchform" role="search" action="#" onsubmit="return false">
      <input class="srch" id="srch" type="search" enterkeyhint="done"
             autocapitalize="none" autocorrect="off" spellcheck="false"
             placeholder="Filter by name or genre" aria-label="Filter by name or genre">
      <button class="srchx" id="srchx" type="button" aria-label="Clear filter" hidden>&times;</button>
    </form>
    <p class="count" id="count"></p>
  </div>

  <div class="acts" id="acts"></div>

  <footer>
    <p id="prov"></p>
    <p>Act descriptions, line-ups and discographies come from web research and may contain errors.
       Song picks are an introduction to each act, not a ranking.</p>
  </footer>
</div>

<dialog id="dlg" aria-labelledby="dlgtitle">
  <div class="dhead">
    <h3 id="dlgtitle"></h3>
    <button class="dx" id="dlgx" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="dbody" id="dlgbody"></div>
</dialog>

      "detail": "Shane Michael Boose (b. 2005) started posting self-recorded songs while a vocal major at LaGuardia High School, took the name sombr in 2021, and dropped out after his fourth single \"caroline\" went viral in 2022; Warner Records signed him in early 2023 and released the EP In Another Life that September, co-produced by Tony Berg. The debut album I Barely Know Her (August 2025) was written entirely by Boose and produced with Berg; \"back to friends\" peaked at No. 7 on the Billboard Hot 100, spent 52 weeks on the chart and won Best Alternative Video at the 2025 VMAs, and \"undressed\" reached No. 16 and topped the US Hot Rock & Alternative Songs chart. He was nominated for Best New Artist at the 68th Grammy Awards and performed at the ceremony in February 2026. 2026 has so far been standalone singles rather than an album — \"homewrecker\" (February, with Wendy Melvoin of Prince's Revolution on bass), \"potential\" (April) and \"my body isn't ready\" (June) — alongside The Late Nights & Young Romance Tour and the You Are The Reason Tour. He is now based in Los Angeles. All his track titles are stylised in lowercase, and Flow bills him as \"SOMBR\" where he writes it \"sombr\".",

  });
  $("dlgx").addEventListener("click", function () { dlg.close(); });
  dlg.addEventListener("click", function (e) {
    /* The backdrop is the dialog element itself; a click on a child bubbles here
       with a different target. */
    if (e.target === dlg) { dlg.close(); }
  });
  dlg.addEventListener("close", function () {
    unlockScroll();
    window.scrollTo(0, scrollY);
  });

  /* ---- theme ---------------------------------------------------------- */
  var btn = $("themebtn");
  btn.addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var next = cur === "dark" ? "light" : cur === "light" ? "" : "dark";
    if (next) { document.documentElement.setAttribute("data-theme", next); }
    else { document.documentElement.removeAttribute("data-theme"); }
    btn.textContent = next ? "Theme: " + next : "Theme";
  });

  renderChips();
  render();
})();
</script>
</body>
</html>
