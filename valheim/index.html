<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valheim — Unkirk Storage Wall</title>
<style>
  :root {
    --iron: #1c211f;
    --ash: #262b26;
    --ash-2: #2f352e;
    --bone: #e9e3d0;
    --moss: #97a08f;
    --moss-dim: #8a9284;
    --ember: #c97a3d;
    --ember-dim: #a4622f;
    --tarn: #6fa3ac;
    --line: #3a4038;
    --shadow: rgba(0,0,0,0.45);

    --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  :root[data-theme="light"] {
    --iron: #ece4cf;
    --ash: #f8f2e2;
    --ash-2: #efe6d0;
    --bone: #2a2620;
    --moss: #5b6152;
    --moss-dim: #83897a;
    --ember: #a85a26;
    --ember-dim: #8c4a1e;
    --tarn: #3f6b76;
    --line: #d9cfb2;
    --shadow: rgba(90, 70, 40, 0.18);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --iron: #ece4cf;
      --ash: #f8f2e2;
      --ash-2: #efe6d0;
      --bone: #2a2620;
      --moss: #5b6152;
      --moss-dim: #5a6050;
      --ember: #a85a26;
      --ember-dim: #8c4a1e;
      --tarn: #3f6b76;
      --line: #d9cfb2;
      --shadow: rgba(90, 70, 40, 0.18);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--iron);
    color: var(--bone);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  header.head {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    margin-bottom: 2.2rem;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ember);
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.7rem, 3.2vw, 2.4rem);
    margin: 0;
    text-wrap: balance;
    letter-spacing: 0.01em;
  }

  .sub {
    color: var(--moss);
    max-width: 62ch;
    font-size: 0.98rem;
  }

  .toolbar {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    margin: 1.6rem 0 1.8rem;
    flex-wrap: wrap;
  }

  .focus-toggle {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--moss);
    background: var(--ash);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.42rem 0.9rem;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .focus-toggle:hover { color: var(--bone); border-color: var(--moss-dim); }

  .focus-toggle[aria-pressed="true"] {
    color: var(--ember);
    border-color: var(--ember);
  }

  .focus-toggle:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ember) 25%, transparent);
  }

  body.focus-mode .head,
  body.focus-mode .count-pill,
  body.focus-mode .view-toggle {
    display: none;
  }

  body.focus-mode .page {
    padding-top: 1.1rem;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    column-gap: 1.2rem;
    position: relative; /* anchors the full-width results overlay */
  }

  /* Boxes keep their natural width; the toolbar (search + exit button,
     already a flex row internally) grows to soak up whatever's left —
     "use the full space" without needing the boxes to stretch. */
  body.focus-mode .wall-scroll { order: 1; margin: 0; padding: 0.6rem 0 0; flex: 0 1 auto; }
  body.focus-mode .toolbar { order: 2; margin: 0; flex: 1 1 260px; }
  body.focus-mode .toolbar .search-wrap { flex: 1 1 auto; }

  /* flex-basis: 100% forces this onto its own line in a wrapping flex row —
     the drawer always spans full width below, never squeezed beside anything. */
  body.focus-mode .drawer { order: 4; flex: 1 1 100%; margin-top: 1rem; }

  /* Results overlay: pulled out of flow entirely (position: absolute) so it
     can NEVER push the drawer down. JS sets top/left/right to pin it exactly
     under the search column, and caps max-height at the next element below
     (boxes or drawer) so it fills only the empty space between them. */
  body.focus-mode .matches {
    order: 3;
    position: absolute;
    margin: 0;
    z-index: 20;
    box-shadow: 0 10px 24px var(--shadow);
  }

  @media (max-width: 800px) {
    body.focus-mode .page { flex-direction: column; }
    body.focus-mode .wall-scroll,
    body.focus-mode .toolbar,
    body.focus-mode .drawer { flex-basis: 100%; }
  }

  .search-wrap {
    position: relative;
    flex: 1 1 320px;
    min-width: 220px;
  }

  .search-wrap svg {
    position: absolute;
    left: 0.85rem;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    stroke: var(--moss-dim);
    pointer-events: none;
  }

  #search {
    width: 100%;
    background: var(--ash);
    border: 1px solid var(--line);
    color: var(--bone);
    font-family: var(--font-body);
    font-size: 0.95rem;
    padding: 0.68rem 2.1rem 0.68rem 2.35rem;
    border-radius: 5px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  #search::placeholder { color: var(--moss-dim); }

  #search:focus-visible {
    border-color: var(--ember);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ember) 22%, transparent);
  }

  #searchClear {
    position: absolute;
    right: 0.5rem;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    border: none;
    background: transparent;
    color: var(--moss-dim);
    font-size: 1.15rem;
    line-height: 1;
    cursor: pointer;
    border-radius: 4px;
    display: none;
    align-items: center;
    justify-content: center;
  }

  #searchClear:hover { color: var(--bone); background: var(--ash-2); }

  #searchClear:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--ember) 35%, transparent);
  }

  .search-wrap.has-text #searchClear { display: flex; }

  .count-pill {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--moss);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.42rem 0.85rem;
    white-space: nowrap;
  }

  .count-pill b { color: var(--bone); font-weight: 600; }

  .view-toggle {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--moss);
    cursor: pointer;
    white-space: nowrap;
  }

  .view-toggle input {
    accent-color: var(--ember);
    width: 15px;
    height: 15px;
    cursor: pointer;
  }

  .view-toggle:hover { color: var(--bone); }

  .matches {
    margin: -0.6rem 0 1.6rem;
    display: none;
    flex-direction: column;
    gap: 0.3rem;
    border: 1px solid var(--line);
    background: var(--ash);
    border-radius: 6px;
    padding: 0.5rem;
    max-height: 260px;
    overflow-y: auto;
  }

  .matches.show { display: flex; }

  .match-row {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    padding: 0.4rem 0.6rem;
    border-radius: 4px;
    cursor: pointer;
    background: transparent;
    border: none;
    text-align: left;
    font-family: var(--font-body);
    color: var(--bone);
    font-size: 0.88rem;
  }

  .match-row:hover, .match-row:focus-visible {
    background: var(--ash-2);
    outline: none;
  }

  .match-row .item-name { flex: 0 0 auto; font-weight: 600; }
  .match-row .item-loc { color: var(--moss); font-family: var(--font-mono); font-size: 0.78rem; }
  .match-row .item-cat { color: var(--tarn); font-size: 0.82rem; margin-left: auto; }

  .no-match {
    color: var(--moss-dim);
    font-size: 0.86rem;
    padding: 0.5rem 0.6rem;
  }

  /* --- the wall --- */

  .wall-scroll {
    overflow-x: auto;
    padding-top: 0.6rem;
    padding-bottom: 0.6rem;
    margin: -0.6rem -1.5rem 0;
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .wall {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 96px;
    grid-template-rows: auto 1fr 1fr;
    gap: 8px 10px;
    width: max-content;
  }

  .wall.grid-mode {
    grid-auto-flow: row;
    grid-template-columns: repeat(4, minmax(72px, 1fr));
    grid-template-rows: repeat(3, 62px);
    gap: 6px;
    width: 100%;
    max-width: 500px;
  }

  .wall.grid-mode .cell {
    min-height: 62px;
    padding: 0.3rem 0.3rem;
    gap: 0.2rem;
  }

  .wall.grid-mode .cell-label { font-size: 0.62rem; letter-spacing: 0.01em; }

  .wall.grid-mode .box { min-height: 8px; }

  .col-number {
    grid-row: 1;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--moss-dim);
    letter-spacing: 0.05em;
  }

  .cell {
    grid-column: auto;
    border: 1px solid var(--line);
    border-radius: 4px;
    background:
      linear-gradient(180deg, color-mix(in srgb, var(--ash-2) 88%, transparent) 0%, var(--ash) 100%);
    padding: 0.6rem 0.5rem;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: stretch;
    gap: 0.4rem;
    min-height: 96px;
    cursor: pointer;
    position: relative;
    transition: transform 0.12s ease, border-color 0.15s ease, opacity 0.2s ease, box-shadow 0.15s ease;
  }

  .cell:hover { transform: translateY(-2px); border-color: var(--moss-dim); }

  .cell:focus-visible {
    outline: none;
    border-color: var(--ember);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ember) 25%, transparent);
  }

  .cell.active {
    border-color: var(--ember);
    background: linear-gradient(180deg, color-mix(in srgb, var(--ember) 16%, var(--ash-2)) 0%, var(--ash) 100%);
    box-shadow: 0 4px 14px var(--shadow);
  }

  .cell.dim { opacity: 0.28; }
  .cell.hit { border-color: var(--tarn); box-shadow: 0 0 0 2px color-mix(in srgb, var(--tarn) 35%, transparent); }
  .cell.active.hit { border-color: var(--ember); box-shadow: 0 4px 14px var(--shadow); }

  .cell.empty {
    cursor: default;
    border-style: dashed;
    background: transparent;
    opacity: 0.55;
  }
  .cell.empty:hover { transform: none; border-color: var(--line); }

  .cell-label {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.74rem;
    letter-spacing: 0.03em;
    text-align: center;
    line-height: 1.15;
  }

  .box-stack {
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex: 1;
  }

  .box {
    flex: 1;
    min-height: 14px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--bone) 5%, var(--ash-2)) 0%, var(--ash) 100%);
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--bone) 7%, transparent);
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .cell.active .box {
    border-color: var(--ember);
    background: linear-gradient(180deg, color-mix(in srgb, var(--ember) 24%, var(--ash-2)) 0%, var(--ash) 100%);
  }

  .cell.hit .box { border-color: var(--tarn); }
  .cell.active.hit .box { border-color: var(--ember); }

  .cell.empty .box {
    border-style: dashed;
    background: transparent;
    box-shadow: none;
  }

  /* --- detail drawer --- */

  .drawer {
    margin-top: 2rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--ash);
    overflow: hidden;
  }

  .drawer-empty {
    padding: 2.2rem 1.6rem;
    text-align: center;
    color: var(--moss-dim);
    font-size: 0.92rem;
  }

  .drawer-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.3rem 1.5rem 1rem;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }

  .drawer-head h2 {
    font-family: var(--font-display);
    font-size: 1.35rem;
    margin: 0;
    font-weight: 600;
  }

  .drawer-meta {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--tarn);
    white-space: nowrap;
  }

  .drawer-desc {
    padding: 0.9rem 1.5rem 0;
    color: var(--moss);
    font-size: 0.92rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .drawer-items {
    padding: 1rem 1.5rem 1.5rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    grid-auto-rows: min-content;
    gap: 0.5rem 1rem;
    max-height: 46vh;
    overflow-y: auto;
  }

  .drawer-items li {
    list-style: none;
    padding: 0.45rem 0 0.45rem 1rem;
    border-left: 2px solid var(--line);
    font-size: 0.92rem;
  }

  .drawer-items li.flash { border-left-color: var(--tarn); color: var(--tarn); }

  .drawer-items mark.hl {
    background: color-mix(in srgb, var(--tarn) 32%, transparent);
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
  }

  .drawer-items li.capped { border-left-color: var(--ember); }

  .item-cap {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ember);
    margin-top: 0.15rem;
  }

  .item-cap::before { content: "\26A0  "; }


  @media (max-width: 640px) {
    .page { padding: 1.6rem 1rem 3rem; }
    .drawer-items { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .wall.grid-mode { grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 100%; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <div class="eyebrow">Valheim &middot; Unkirk world &middot; Chest Reference</div>
    <h1>The Storage Wall</h1>
    <p class="sub">Food, ore &amp; metal, wood, and stone stored separately. Click a chest to see
      what belongs in it, or search for an item to find its home.</p>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="Search an item&hellip; e.g. amber, arrows, chain" autocomplete="off" />
      <button id="searchClear" type="button" aria-label="Clear search" title="Clear search">&times;</button>
    </div>
    <div class="count-pill" id="countPill"><b id="catCount">0</b> categories &middot; <b id="itemCount">0</b> items tracked</div>
    <label class="view-toggle">
      <input type="checkbox" id="gridToggle" />
      <span>Alternative build &mdash; 10-column corridor, stacked pairs</span>
    </label>
    <button id="focusToggle" class="focus-toggle" type="button" aria-pressed="false">Focus mode</button>
  </div>

  <div class="matches" id="matches"></div>

  <div class="wall-scroll">
    <div class="wall" id="wall"></div>
  </div>

  <div class="drawer" id="drawer">
    <div class="drawer-empty">Select a chest above to see what's stored inside.</div>
  </div>
</div>

    { id: "drop",    col: 6, pos: "bottom", label: "DROP",  name: "Drop",
      desc: "One chest for anything without a home yet — empty it into the wall when you sort.",
      items: ["Unsorted new drops", "Anything awaiting its own category"] },
  ];

  // Items with a known, fixed use — mostly boss summons — where farming a full
  // stack is wasted effort. Marked with a badge in the drawer instead of a plain bullet.
  const LOW_QTY_NOTES = {
    "Deer Trophy": "Eikthyr summon — needs 2",
    "Ancient Seed": "The Elder summon — needs 3",
    "Withered Bone": "Bonemass summon — needs 10",
    "Dragon Egg": "Moder summon — needs 3, 200 weight each, don't stockpile",
    "Fuling Totem": "Yagluth summon — needs 5",
    "Seeker Soldier Trophy": "The Queen summon — needs 3",
    "Bell Fragment": "Fader summon — needs 9 (3 Bells, 3 Fragments each)",
    "Chain": "Feeds a handful of one-off gear/station builds, not a steady sink",
    "Hard Antler": "Antler Pickaxe is its only use — Eikthyr drops it",
    "Swamp Key": "Never consumed — one key opens every Sunken Crypt",
    "Ymir Flesh": "Only Frostner and the Iron Sledge use it — buy from Haldor to order",
    "Dragon Tear": "Moder drops 10 — the Artisan Table is its main sink",
    "Majestic Carapace": "Artisan Press is its only build — The Queen drops it",
    "Thunder Stone": "Obliterator needs 1 — from Haldor",
    "Sealbreaker Fragment": "The Queen's door — 9 make one Sealbreaker",
    "Sealbreaker": "One-off key to The Queen",
    "Drake Trophy": "Drake Helmet needs 2 (once) — plus fishing bait if you fish",
    "Wolf Trophy": "Wolf Fur Cape needs 1",
    "Cultist Trophy": "Fenris Hood needs 1",
    "Fenring Trophy": "Wolf Sight needs 1",
    "Stone Golem Trophy": "Crystal Heart needs 1",
    "Wishbone": "Unique — only ever need 1, Bonemass drops one per player",
    "Root": "Root armor set only — 66 covers base + all upgrades",
    "Mandible": "A handful of one-off Mistlands gear crafts",
    "Morgen Heart": "Flametal Breastplate is its only recipe",
    "Vineberry Seeds": "1 seed = 1 tree, and trees drop seeds back — a few is plenty",
    "Acorn": "1 seed = 1 tree, and trees drop seeds back — a few is plenty",
    "Beech Seeds": "1 seed = 1 tree, and trees drop seeds back — a few is plenty",
    "Birch Seeds": "1 seed = 1 tree, and trees drop seeds back — a few is plenty",
    "Fir Cone": "1 seed = 1 tree, and trees drop seeds back — a few is plenty",
    "Pine Cone": "1 seed = 1 tree, and trees drop seeds back — a few is plenty",
  };

  const wall = document.getElementById("wall");
  const drawer = document.getElementById("drawer");
  const searchInput = document.getElementById("search");
  const matchesBox = document.getElementById("matches");
  const itemCountEl = document.getElementById("itemCount");
  const catCountEl = document.getElementById("catCount");

  const totalItems = CATEGORIES.reduce((n, c) => n + c.items.length, 0);
  itemCountEl.textContent = totalItems;
  catCountEl.textContent = CATEGORIES.length;

  function buildCorridorWall() {
    const lastCol = Math.max(...CATEGORIES.map(c => c.col));
    for (let col = 1; col <= lastCol; col++) {
      const numEl = document.createElement("div");
      numEl.className = "col-number";
      numEl.style.gridColumn = col;
      numEl.textContent = String(col).padStart(2, "0");
      wall.appendChild(numEl);

      const full = CATEGORIES.find(c => c.col === col && c.pos === "full");
      if (full) {
        wall.appendChild(makeCell(full, col, "2 / 4", 4));
        continue;
      }

      const top = CATEGORIES.find(c => c.col === col && c.pos === "top");
      const bottom = CATEGORIES.find(c => c.col === col && c.pos === "bottom");

      wall.appendChild(makeCell(top, col, 2, 2));
      wall.appendChild(makeCell(bottom, col, 3, 2));
    }
  }

  // Alternative physical setup: a 5x4 grid of single chests instead of the corridor,
  // columns grouped by similarity so related categories sit together — combat gear,
  // creature-harvested materials, crafting/fletching supplies, and collectibles each
  // fill a column, with the farming pair and Drop (stacked, two chests) sharing the last.
  // 4x3 grid, one chest per category. Column 1 is the workshop, and Drop sits
  // in the bottom-right corner of the wall.
  const GRID_COLUMNS = [
    ["gear", "arrows", "hardware"],
    ["hides", "bone", "parts"],
    ["feathers", "resin", "farm"],
    ["trophy", "value", "drop"],
  ];
  const GRID_SPANS = {};
  const GRID_ROWS = 3;

  function buildGridWall() {
    const byId = id => CATEGORIES.find(c => c.id === id);
    GRID_COLUMNS.forEach((colIds, colIdx) => {
      const col = colIdx + 1;
      let row = 1;
      colIds.forEach(id => {
        const span = GRID_SPANS[id] || 1;
        wall.appendChild(makeCell(byId(id), col, span > 1 ? `${row} / span ${span}` : row, span));
        row += span;
      });
      while (row <= GRID_ROWS) wall.appendChild(makeCell(null, col, row++, 1));
    });
  }

  function renderWall() {
    wall.innerHTML = "";
    const isGrid = !gridToggle.checked;
    wall.classList.toggle("grid-mode", isGrid);
    if (isGrid) buildGridWall(); else buildCorridorWall();

    if (activeId) {
      document.querySelectorAll(".cell").forEach(el => el.classList.toggle("active", el.dataset.id === activeId));
      renderDrawer(activeId);
    }
    if (searchInput.value.trim()) runSearch(searchInput.value);
  }

  function makeCell(cat, col, row, boxCount) {
    const el = document.createElement("div");
    if (col != null) el.style.gridColumn = col;
    if (row != null) el.style.gridRow = row;

    const boxesHtml = Array.from({ length: boxCount }, () => '<div class="box"></div>').join("");

    if (!cat) {
      el.className = "cell empty";
      el.innerHTML = `<div class="cell-label" style="color:var(--moss-dim)">&mdash;</div><div class="box-stack">${boxesHtml}</div>`;
      el.title = "Reserved for growth";
      return el;
    }

    el.className = "cell";
    el.tabIndex = 0;
    el.dataset.id = cat.id;
    el.setAttribute("role", "button");
    el.setAttribute("aria-label", cat.name);
    el.innerHTML = `<div class="cell-label">${cat.label}</div><div class="box-stack">${boxesHtml}</div>`;
    el.addEventListener("click", () => selectCategory(cat.id));
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        selectCategory(cat.id);
      } else if (e.key.startsWith("Arrow")) {
        e.preventDefault();
        const next = findCellInDirection(el, e.key);
        if (next) {
          next.focus();
          selectCategory(next.dataset.id);
        }
      }
    });
    return el;
  }

  // Geometry-based, not grid-index-based, so it works unmodified in both the
  // corridor layout and the alternative 5x4 grid (including spanning cells like Drop).
  function findCellInDirection(current, key) {
    const center = el => {
      const r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    };
    const cur = center(current);
    const candidates = Array.from(document.querySelectorAll(".cell:not(.empty)")).filter(el => el !== current);

    let best = null, bestScore = Infinity;
    for (const el of candidates) {
      const c = center(el);
      const dx = c.x - cur.x, dy = c.y - cur.y;
      let primary, perpendicular;
      if (key === "ArrowRight") { primary = dx; perpendicular = dy; }
      else if (key === "ArrowLeft") { primary = -dx; perpendicular = dy; }
      else if (key === "ArrowDown") { primary = dy; perpendicular = dx; }
      else if (key === "ArrowUp") { primary = -dy; perpendicular = dx; }
      if (primary <= 1) continue; // must actually be in that direction
      const score = primary + Math.abs(perpendicular) * 1.5;
      if (score < bestScore) { bestScore = score; best = el; }
    }
    return best;
  }

  let activeId = null;

  function selectCategory(id) {
    activeId = id;
    document.querySelectorAll(".cell").forEach(el => {
      el.classList.toggle("active", el.dataset.id === id);
    });
    renderDrawer(id);
  }

  function getLocationLabel(cat) {
    if (!gridToggle.checked) {
      for (let c = 0; c < GRID_COLUMNS.length; c++) {
        let row = 1;
        for (const id of GRID_COLUMNS[c]) {
          const span = GRID_SPANS[id] || 1;
          if (id === cat.id) {
            const colLabel = `column ${String(c + 1).padStart(2, "0")}`;
            return span > 1
              ? `${colLabel} &middot; rows ${row}&ndash;${row + span - 1}, stacked`
              : `${colLabel} &middot; row ${row}`;
          }
          row += span;
        }
      }
      return "";
    }
    if (cat.pos === "full") return `column ${String(cat.col).padStart(2, "0")} &middot; full column`;
    return `column ${String(cat.col).padStart(2, "0")} &middot; ${cat.pos} slot`;
  }

  function renderDrawer(id, flashItem) {
    const cat = CATEGORIES.find(c => c.id === id);
    if (!cat) {
      drawer.innerHTML = '<div class="drawer-empty">Select a chest above to see what\'s stored inside.</div>';
      return;
    }
    // A clicked match row highlights that one item (flash) — suppress the
    // free-text substring marks so the selection stands alone.
    const q = flashItem ? "" : searchInput.value.trim().toLowerCase();
    const itemsHtml = cat.items.map(it => {
      const flash = flashItem && it.toLowerCase() === flashItem.toLowerCase() ? "flash" : "";
      const cap = LOW_QTY_NOTES[it];
      const capClass = cap ? "capped" : "";
      const capHtml = cap ? `<span class="item-cap">${highlightMatch(cap, q)}</span>` : "";
      const cls = [flash, capClass].filter(Boolean).join(" ");
      return `<li class="${cls}">${highlightMatch(it, q)}${capHtml}</li>`;
    }).join("");
    drawer.innerHTML = `
      <div class="drawer-head">
        <h2>${cat.name}</h2>
        <div class="drawer-meta">${getLocationLabel(cat)}</div>
      </div>
      <div class="drawer-desc">${cat.desc}</div>
      <ul class="drawer-items">${itemsHtml}</ul>
    `;
  }

  function runSearch(query) {
    const q = query.trim().toLowerCase();
    const cells = document.querySelectorAll(".cell:not(.empty)");

    if (!q) {
      cells.forEach(el => el.classList.remove("dim", "hit"));
      matchesBox.classList.remove("show");
      matchesBox.innerHTML = "";
      if (activeId) renderDrawer(activeId);
      return;
    }

    const matchedCatIds = new Set();
    const itemHits = [];

    CATEGORIES.forEach(cat => {
      const catNameHit = cat.name.toLowerCase().includes(q) || cat.label.toLowerCase().includes(q);
      const itemHitsForCat = cat.items.filter(it => {
        const noteText = (LOW_QTY_NOTES[it] || "").toLowerCase();
        return it.toLowerCase().includes(q) || noteText.includes(q);
      });
      if (catNameHit || itemHitsForCat.length) matchedCatIds.add(cat.id);
      itemHitsForCat.forEach(it => itemHits.push({ item: it, cat }));
    });

    cells.forEach(el => {
      const isHit = matchedCatIds.has(el.dataset.id);
      el.classList.toggle("dim", !isHit);
      el.classList.toggle("hit", isHit);
    });

    if (itemHits.length === 0) {
      matchesBox.innerHTML = '<div class="no-match">No item matches &ldquo;' + escapeHtml(query) + '&rdquo;.</div>';
    } else {
      matchesBox.innerHTML = itemHits.map(({ item, cat }) => {
        const cap = LOW_QTY_NOTES[item];
        const capHtml = cap ? `<span class="item-cap">${cap}</span>` : "";
        return `
        <button class="match-row" data-cat="${cat.id}" data-item="${escapeHtml(item)}">
          <span class="item-name">${item}${capHtml}</span>
          <span class="item-loc">${getLocationLabel(cat)}</span>
          <span class="item-cat">${cat.name}</span>
        </button>
      `;
      }).join("");
    }
    matchesBox.classList.add("show");
    positionMatchesOverlay();
    if (activeId) renderDrawer(activeId);
  }

  function positionMatchesOverlay() {
    if (!document.body.classList.contains("focus-mode")) {
      matchesBox.style.top = matchesBox.style.left = matchesBox.style.right = matchesBox.style.maxHeight = "";
      return;
    }
    const pageRect = document.querySelector(".page").getBoundingClientRect();
    const toolbarRect = document.querySelector(".toolbar").getBoundingClientRect();
    matchesBox.style.top = (toolbarRect.bottom - pageRect.top + 8) + "px";
    matchesBox.style.left = (toolbarRect.left - pageRect.left) + "px";
    matchesBox.style.right = (pageRect.right - toolbarRect.right) + "px";
    // Cap height at whatever sits below (boxes on narrow screens, drawer on wide),
    // so the list fills only the free space and never covers either.
    const below = [".wall-scroll", ".drawer"]
      .map(sel => document.querySelector(sel).getBoundingClientRect())
      .filter(r => r.height > 0 && r.top >= toolbarRect.bottom)
      .map(r => r.top);
    const limit = below.length ? Math.min(...below) - toolbarRect.bottom - 16 : window.innerHeight * 0.6;
    matchesBox.style.maxHeight = Math.max(140, limit) + "px";
  }

  window.addEventListener("resize", positionMatchesOverlay);

  function highlightMatch(text, q) {
    if (!q) return text;
    const lower = text.toLowerCase();
    let out = "", pos = 0, idx;
    while ((idx = lower.indexOf(q, pos)) !== -1) {
      out += text.slice(pos, idx) + '<mark class="hl">' + text.slice(idx, idx + q.length) + "</mark>";
      pos = idx + q.length;
    }
    return out + text.slice(pos);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  matchesBox.addEventListener("click", (e) => {
    const row = e.target.closest(".match-row");
    if (!row) return;
    selectCategory(row.dataset.cat);
    renderDrawer(row.dataset.cat, row.dataset.item);
    document.getElementById("drawer").scrollIntoView({ behavior: "smooth", block: "nearest" });
    matchesBox.classList.remove("show");
  });

  const searchWrap = document.querySelector(".search-wrap");
  const searchClear = document.getElementById("searchClear");

  searchInput.addEventListener("input", (e) => {
    searchWrap.classList.toggle("has-text", e.target.value.length > 0);
    runSearch(e.target.value);
  });

  searchInput.addEventListener("focus", () => {
    if (searchInput.value.trim()) runSearch(searchInput.value);
  });

  document.addEventListener("click", (e) => {
    if (!searchWrap.contains(e.target) && !matchesBox.contains(e.target)) {
      matchesBox.classList.remove("show");
    }
  });

  searchClear.addEventListener("click", () => {
    searchInput.value = "";
    searchWrap.classList.remove("has-text");
    runSearch("");
    searchInput.focus();
  });

  const gridToggle = document.getElementById("gridToggle");
  gridToggle.checked = new URLSearchParams(location.search).get("view") === "corridor";

  gridToggle.addEventListener("change", () => {
    const url = new URL(location.href);
    if (gridToggle.checked) url.searchParams.set("view", "corridor");
    else url.searchParams.delete("view");
    history.replaceState(null, "", url);
    renderWall();
  });

  const focusToggle = document.getElementById("focusToggle");

  function setFocusMode(active) {
    document.body.classList.toggle("focus-mode", active);
    focusToggle.setAttribute("aria-pressed", String(active));
    focusToggle.textContent = active ? "Exit focus mode" : "Focus mode";
    positionMatchesOverlay();
  }

  setFocusMode(new URLSearchParams(location.search).get("focus") === "1");

  focusToggle.addEventListener("click", () => {
    const active = !document.body.classList.contains("focus-mode");
    setFocusMode(active);
    const url = new URL(location.href);
    if (active) url.searchParams.set("focus", "1");
    else url.searchParams.delete("focus");
    history.replaceState(null, "", url);
  });

  // Self-check: catch silent data-sync slips (a renamed/removed item that leaves
  // a stale LOW_QTY_NOTES key, or a category id missing from GRID_COLUMNS) as soon
  // as the page loads, instead of a badge or grid cell just quietly not appearing.
  (function validateData() {
    const allIds = new Set(CATEGORIES.map(c => c.id));
    const gridIds = new Set(GRID_COLUMNS.flat());
    for (const id of allIds) console.assert(gridIds.has(id), `Category "${id}" is missing from GRID_COLUMNS`);
    for (const id of gridIds) console.assert(allIds.has(id), `GRID_COLUMNS references unknown category "${id}"`);
    const allItems = new Set(CATEGORIES.flatMap(c => c.items));
    for (const item of Object.keys(LOW_QTY_NOTES)) {
      console.assert(allItems.has(item), `LOW_QTY_NOTES has "${item}" but no category lists it`);
    }
  })();

  renderWall();
</script>
