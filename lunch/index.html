n dish from a wide selection of quality grilled meats, vegetables, side dishes and sauces. To complement this dish, you can choose from various types of appetizers and desserts from multiple options. Muré's praised wine list includes, among other things, quality wines from the Rioja region's Marqués de Cáceres estate, which cannot be found elsewhere in Finland.","ai":1,"diet":["veg"],"style":["steak_house"],"type":["desc"]},{"fi":"Murén keittiössä valmistettava suomalainen liha on maailman parasta. Atrian liha on voittanut ’maailman parhaan’ tittelin kolmesti maailmanlaajuisessa World Steak Challenge -kilpailussa. Muréseen lihat toimitetaan Atrian Jyväskylän teurastamosta, jossa ravintolaan tulevat lihat valitaan käsityönä arvioimisen ja luokittelun jälkeen. Suurin määrittelevä tekijä valinnoissa on lihan pinnassa näkyvä marmoroituminen. Teurastamolta toimitetaan ravintolaan lihaa joka viikko, joten asiakkaiden lautasilla oleva liha on aina tuoreista tuoreinta.","style":["steak_house"],"type":["desc"]},{"fi":"Muréssa liha arvioidaan aina kolmen kriteerin kautta: mureus, marmoroituminen ja maun voimakkuus asteikolla yhdestä kymmeneen. Ne ovat ohjenuoramme täydelliseen liha-annokseen. Nämä kolme kriteeriä, samoin kuin lihan alkuperä tilatasolla, ovat nähtävillä ravintolan seinällä olevilla liitutauluilla päivän tarjonnan mukaan.","en":"At Muré, meat is always evaluated by three criteria: tenderness, marbling and flavor intensity on a scale of one to ten. They are our guidelines for the perfect meat dish. These three criteria, as well as the origin of the meat at farm level, are displayed on the chalkboards on the restaurant's walls according to the day's offering.","ai":1,"style":["steak_house"],"type":["desc"]},{"fi":"Tervetuloa nauttimaan suomalaista, maailman parasta lihaa.","en":"Welcome to enjoy Finnish, the world's best meat.","ai":1,"style":["steak_house"],"cat":["meat"]},{"fi":"Murén lahjakortit","en":"Muré gift cards","ai":1,"style":["steak_house"],"cat":["meat"]},{"fi":"Yllätä ystäväsi herkullisella lahjalla! Gastrogrill Murén lahjakortit saat hankittua kätevimmin osoitteesta Lihakauppa.fi . Valitse 50, 100 tai 150 euron arvoinen lahjakortti, jolla pääsee makumatkalle suomalaisen, maailman parhaan lihan äärelle.","en":"Surprise your friend with a delicious gift! You can conveniently purchase Gastrogrill Murén gift cards from Lihakauppa.fi. Choose a gift card worth €50, €100 or €150, with which you can go on a culinary journey around Finnish, the world's best meat.","ai":1,"style":["steak_house"],"type":["desc"]},{"fi":"Osta lahjakortti tästä","en":"Buy gift card here","ai":1,"style":["steak_house"],"cat":["meat"]},{"fi":"Menu Muré","en":"Menu Muré","ai":1,"style":["steak_house"],"cat":["meat"]},{"fi":"Viinit","en":"Wines","ai":1,"style":["steak_house"],"cat":["meat"]},{"fi":"Menu Muré","en":"Menu Muré","ai":1,"style":["steak_house"],"cat":["meat"]},{"fi":"Läpileikkaus Murén tarjonnasta","en":"A cross-section of Mure's offering","ai":1,"style":["steak_house"],"cat":["meat"]},{"fi":"72 € / hlö","price":72.0,"en":"72 € / person","ai":1,"style":["steak_house"],"cat":["meat"]},{"fi":"Viinipaketti menulle","price":49.0,"en":"Wine pairing package for menu","ai":1,"style":["steak_house"],"cat":["meat"]},{"fi":"Menu kokonaisuus tarjotaan koko pöytäseurueelle ja vähintään kahdelle hengelle","en":"Menu is offered as a whole for the entire table and a minimum of two people","ai":1,"style":["steak_house"],"cat":["meat"]},{"fi":"Keittiömestarin klassikkomenu","en":"Chef's classic menu","ai":1,"style":["steak_house"],"cat":["meat"]},{"fi":"64 € / hlö","price":64.0,"en":"64 € / person","ai":1,"style":["steak_house"],"cat":["meat"]},{"fi":"Viinipaketti menulle","price":39.0,"en":"Wine pairing package for menu","ai":1,"style":["steak_house"],"cat":["meat"]},{"fi":"Tartar Murén tapaan","en":"Tartar Mure style","ai":1,"style":["steak_house"],"cat":["meat"]},{"fi":"Vaihtuva päivän leikkuu, puikulaperunaranskalaisia ja Murén ketsuppia ja ma Array.prototype.forEach.call($('lang').querySelectorAll('button'),function(b){b.onclick=function(){lang=b.dataset.l;L=T[lang];store.set('lang',lang);paint()}});

function paint(){
document.documentElement.lang=lang;
Array.prototype.forEach.call($('lang').querySelectorAll('button'),function(b){b.setAttribute('aria-pressed',String(b.dataset.l===lang));b.setAttribute('aria-label',b.dataset.l==='fi'?'Suomeksi':'In English')});
$('title').textContent=L.title;document.title=L.title;
$('sub').textContent=L.sub+(data.week?' · '+L.week+' '+data.week:'');
$('linksH').textContent=L.linksH;$('linksL').hidden=!state.links;$('lt').setAttribute('aria-expanded',String(state.links));
qi.placeholder=L.searchPh;qi.setAttribute('aria-label',L.search);qi.value=state.q;clr.hidden=!state.q;
clr.setAttribute('aria-label',L.clear);$('help').setAttribute('aria-label',L.helpBtn);
$('shT').textContent=L.filters;$('shC').textContent=L.clearF;$('shX').textContent=L.done;
var b=fmtBuilt(data.built),f=$('foot');f.textContent='';
f.appendChild(el('p',null,(b?L.built+' '+b+'. ':'')+L.footer));
if(L.aiNote)f.appendChild(el('p',null,L.aiNote));
f.appendChild(el('p',null,L.stars));
renderDays();renderDist();render();
}
paint();
})();
</script>
