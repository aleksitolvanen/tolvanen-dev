yle":["steak_house"],"cat":["meat"]},{"fi":"Gastrogrill Muréssa jokainen vieras pääsee kokoamaan oman annoksensa laadukkaiden grillattujen lihojen, kasvisten, lisukkeiden ja kastikkeiden monipuolisesta valikoimasta. Ja tätä annosta täydentämään voi valita erityyppisiä alku- ja jälkiruokia useista eri vaihtoehdoista. Murén kehutulle viinilistalle on koottu muun muassa riojalaisen Marqués de Cáceres -viinitilan laadukkaita viinejä, joita ei löydy muualta Suomesta.","en":"At Gastrogrill Muré, every guest can assemble their own dish from a wide selection of quality grilled meats, vegetables, side dishes and sauces. To complement this dish, you can choose from various types of appetizers and desserts from multiple options. Muré's praised wine list includes, among other things, quality wines from the Rioja region's Marqués de Cáceres estate, which cannot be found elsewhere in Finland.","ai":1,"diet":["veg"],"style":["steak_house"],"type":["desc"]},{"fi":"Murén keittiössä valmistettava suomalainen liha on maailman parasta. Atrian liha on voittanut ’maailman parhaan’ tittelin kolmesti maailmanlaajuisessa World Steak Challenge -kilpailussa. Muréseen lihat toimitetaan Atrian Jyväskylän teurastamosta, jossa ravintolaan tulevat lihat valitaan käsityönä arvioimisen ja luokittelun jälkeen. Suurin määrittelevä tekijä valinnoissa on lihan pinnassa näkyvä marmoroituminen. Teurastamolta toimitetaan ravintolaan lihaa joka viikko, joten asiakkaiden lautasilla oleva liha on aina tuoreista tuoreinta.","style":["steak_house"],"type":["desc"]},{"fi":"Muréssa liha arvioidaan aina kolmen kriteerin kautta: mureus, marmoroituminen ja maun voimakkuus asteikolla yhdestä kymmeneen. Ne ovat ohjenuoramme täydelliseen liha-annokseen. Nämä kolme kriteeriä, samoin kuin lihan alkuperä tilatasolla, ovat nähtävillä ravintolan seinällä olevilla liitutauluilla päivän tarjonnan mukaan.","en":"At Muré, meat is always evaluated by three criteria: tenderness, marbling and flavor intensity on a scale of one to
