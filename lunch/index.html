q.split(/\s+/).forEach(function(t){var alts=t.split('/').filter(Boolean);if(!alts.length)return;groups.push(alts.map(function(a){return makeRe(a,false)}));alts.forEach(function(a){hl.push(makeRe(a,true))})});
return groups.length?{groups:groups,hl:hl}:null;
}
var TAGS=/\(\s*[A-ZÄÖ]{1,4}(?:\s*[,/+]\s*[A-ZÄÖ]{1,4})*\s*\)|\s(?:VL|VE|VS|LF|GF|DF|L|G|M|V)(?:\s*,\s*(?:VL|VE|VS|LF|GF|DF|L|G|M|V))*$/g;
function appendHL(node,text,hl){
var ranges=[];
if(hl)hl.forEach(function(re){re.lastIndex=0;var m;while((m=re.exec(text))){if(!m[0]){re.lastIndex++;continue}ranges.push([m.index,m.index+m[0].length])}});
if(!ranges.length){node.appendChild(document.createTextNode(text));return}
ranges.sort(function(a,b){return a[0]-b[0]});
var pos=0;
ranges.forEach(function(r){
if(r[0]<pos){if(r[1]>pos){node.lastChild.textContent+=text.slice(pos,r[1]);pos=r[1]}return}
if(r[0]>pos)node.appendChild(document.createTextNode(text.slice(pos,r[0])));
node.appendChild(el('mark',null,text.slice(r[0],r[1])));pos=r[1];
});
if(pos<text.length)node.appendChild(document.createTextNode(text.slice(pos)));
}
function appendTagged(node,text,hl){
TAGS.lastIndex=0;var pos=0,m;
while((m=TAGS.exec(text))){
if(m.index>pos)appendHL(node,text.slice(pos,m.index),hl);
var sp=el('span','tg');appendHL(sp,m[0],hl);node.appendChild(sp);pos=m.index+m[0].length;
}
if(pos<text.length)appendHL(node,text.slice(pos),hl);
}
function rowEl(r,hl,mark){
var tx=rtext(r),li=el('li',isDesc(r)?'ds':null),t=el('div','t'),s=el('span',tx[0].length>(isDesc(r)?140:220)?'cl':null);
appendTagged(s,tx[0],hl);
if(mark&&tx[1])s.appendChild(el('span','on',tx[1]));
t.appendChild(s);
if(s.className){var b=el('button','mr',L.more);b.type='button';b.onclick=function(){s.className='';b.remove()};t.appendChild(b)}
li.appendChild(t);
if(typeof r.price==='number')li.appendChild(el('span','pr',L.price(r.price)));
return li;
}
function hit(r,hl){var h=(r.fi||'')+' '+(r.en||'');return !!hl&&hl.some(function(re){re.lastIndex=0;return re.test(h)})}

var GROUPS={diet:['vegan','veg','G','L','M'],dish:['soup','fish','chicken','meat','pasta','salad','buffet'],place:['fav','kluuvi','citycenter','forum','stockmann']};
var VEN={kluuvi:/kluuvi/i,citycenter:/citycenter/i,forum:/forum/i,stockmann:/stockmann/i};
function grp(k){for(var g in GROUPS)if(GROUPS[g].indexOf(k)>=0)return g;return 'cui'}
function dh(p,r,k){
switch(k){
case 'veg':return has(r.diet,'veg')||has(r.diet,'vegan');
case 'vegan':case 'G':case 'L':case 'M':return has(r.diet,k);
case 'soup':case 'pasta':case 'salad':case 'buffet':return has(r.type,k);
case 'fish':return has(r.protein,'fish')||has(r.protein,'shrimp');
case 'chicken':return has(r.protein,'chicken');
case 'meat':return ['beef','pork','lamb','game'].some(function(x){return has(r.protein,x)});
case 'fav':return p.stars!=null;
}
if(VEN[k])return VEN[k].test(p.venue||'');
return pc(p).indexOf(k)>=0||has(r.style,k);
}
function act(){var o={};state.f.forEach(function(k){var g=grp(k);(o[g]=o[g]||[]).push(k)});return o}
function pass(p,r,A,skip){for(var g in A){if(g===skip)continue;var ks=A[g],ok=g==='diet'?ks.every(function(k){return dh(p,r,k)}):ks.some(function(k){return dh(p,r,k)});if(!ok)return false}return true}
function fLabel(k){return L.f[k]||cuiLabel(k)}
function toggleF(k){var i=state.f.indexOf(k);if(i>=0)state.f.splice(i,1);else state.f.push(k);store.set('f',JSON.stringify(state.f));render()}

var LIMIT=5;
function card(it,hl){
var p=it.p,a=el('article','pl');a.id='p'+it.i;
var h=el('div','hd1');h.appendChild(el('h2',null,p.name));
if(p.stars!=null){var st=el('span','st','★ '+fmtStars(p.stars));st.title=L.stars;h.appendChild(st)}
a.appendChild(h);
var rs=it.rows,base=it.shown||rs;
if(hl){var sr=base.filter(function(r){return hit(r,hl)});if(sr.length)base=sr}
var narrowed=base.length<rs.length,shown=!narrowed&&rs.length>LIMIT+1?rs.slice(0,LIMIT):base;
var allFb=shown.length>0&&shown.every(function(r){return !r[lang]});
var meta=el('p','meta',metaText(p));
if(allFb)meta.appendChild(el('span','on',rtext(shown[0])[1]));
a.appendChild(meta);
if(it.note)a.appendChild(el('p','note',L.onsite));
var ul=el('ul','menu');
shown.forEach(function(r){ul.appendChild(rowEl(r,hl,!allFb))});
a.appendChild(ul);
var ft=el('div','ft');
if(shown.length<rs.length){
var b=el('button','more',(narrowed?L.whole:L.showAll)(rs.length));b.type='button';
b.onclick=function(){ul.textContent='';rs.forEach(function(r){ul.appendChild(rowEl(r,hl,true))});b.remove();clamp(ul)};
ft.appendChild(b);
}
var u=safeUrl(p.url);
if(u){var s=el('a','src',L.list+' · '+srcLabel(p)+' ↗');s.href=u;s.target='_blank';s.rel='noopener';ft.appendChild(s)}
a.appendChild(ft);
return a;
}
function clamp(root){
var cs=root.querySelectorAll('.cl'),keep=[];
for(var i=0;i<cs.length;i++)if(cs[i].scrollHeight<=cs[i].clientHeight+2)keep.push(cs[i]);
keep.forEach(function(s){s.className='';var b=s.nextSibling;if(b&&b.className==='mr')b.remove()});
}
function linkRow(p,i){
var li=el('li');li.id='p'+i;
var a=el('a'),u=safeUrl(p.url);
if(u){a.href=u;a.target='_blank';a.rel='noopener'}
var n=el('span','n',p.name);
if(p.stars!=null)n.appendChild(el('span','st',' ★ '+fmtStars(p.stars)));
a.appendChild(n);
var d=el('span','d',(p.m>0?p.m+' m':p.venue||''));d.appendChild(el('br'));d.appendChild(document.createTextNode(srcLabel(p)));
a.appendChild(d);
a.appendChild(el('span','ar','↗'));
li.appendChild(a);
return li;
}
function pickEl(day){
var S=data.suggestions,s=S&&S[day];
if(!s||typeof s!=='object')return null;
var idx=-1;P.some(function(p,i){if(p.name===s.place){idx=i;return true}});
var n=el(idx>=0?'a':'div','pick');
if(idx>=0){n.href='#p'+idx;n.onclick=function(e){e.preventDefault();goTo(idx)}}
var lab=el('div','lab',L.pick);
if(s.tag)lab.appendChild(el('span','tag',L.tags[s.tag]||String(s.tag)));
n.appendChild(lab);
if(s.title)n.appendChild(el('h2',null,String(s.title)));
if(s.text)n.appendChild(el('p',null,String(s.text)));
if(idx>=0)n.appendChild(el('div','to','→ '+P[idx].name+(P[idx].m>0?' · '+P[idx].m+' m':'')));
return n;
}
function resetAll(){state.dist=0;store.set('dist','0');state.f=[];store.set('f','[]');renderDist();setQuery('')}
function goTo(idx){
var n=$('p'+idx);
if(!n){resetAll();n=$('p'+idx)}
if(!n)return;
if(n.tagName==='LI'&&!state.links)toggleLinks();
n.scrollIntoView({behavior:'smooth',block:'start'});
n.classList.add('flash');setTimeout(function(){n.classList.remove('flash')},2200);
}

function render(){
var list=$('list'),links=$('linksL');list.textContent='';links.textContent='';
var day=state.day,q=parseQuery(state.q),bad=!!(q&&q.bad);if(bad)q=null;
var hl=q?q.hl:null,A=act(),anyF=state.f.length>0,items=[],lk=[],cands=[];
P.forEach(function(p,i){
if(state.dist&&p.m>state.dist)return;
var rs=day?rows(p,day):[];
if(p.link_only||!rs.length){lk.push({p:p,i:i});return}
if(q){
var hay=[p.name,p.cuisine||'',p.venue||''].concat(rs.map(function(r){return (r.fi||'')+' '+(r.en||'')})).join('\n');
if(!q.groups.every(function(g){return g.some(function(re){return re.test(hay)})}))return;
}
var dr=rs.filter(function(r){return !isDesc(r)});
cands.push({p:p,rows:dr});
var shown=null,note=false;
if(anyF){
if(!dr.length){if(A.dish||!pass(p,{},A,'diet'))return;note=!!A.diet}
else{shown=dr.filter(function(r){return pass(p,r,A)});if(!shown.length)return}
}
items.push({p:p,i:i,rows:rs,shown:shown,note:note});
});
items.sort(function(a,b){var fa=a.p.stars!=null,fb=b.p.stars!=null;if(fa!==fb)return fa?-1:1;if(fa&&a.p.stars!==b.p.stars)return b.p.stars-a.p.stars;return a.p.m-b.p.m||a.p.name.localeCompare(b.p.name)});
lk.sort(function(a,b){return a.p.m-b.p.m||a.p.name.localeCompare(b.p.name)});
$('cnt').textContent=day?dayLabel(day)+' · '+L.places(items.length):'';
if(!day)list.appendChild(el('p','empty',L.noDays));
else{
var pk=pickEl(day);if(pk)list.appendChild(pk);
if(!items.length){
var e=el('div','empty',L.noMatch);
if(q||anyF||state.dist){var b=el('button',null,L.reset);b.type='button';b.onclick=resetAll;e.appendChild(b)}
list.appendChild(e);
}
items.forEach(function(it){list.appendChild(card(it,hl))});
clamp(list);
}
lk.forEach(function(it){links.appendChild(linkRow(it.p,it.i))});
$('links').hidden=!lk.length;$('lt').textContent=L.morePlaces(lk.length);
var hint=$('hint');hint.hidden=!(state.help||bad);hint.textContent=state.help?L.help:L.badRe;hint.className='hint'+(bad&&!state.help?' bad':'');
renderSheet(cands,A);
}
function renderSheet(cands,A){
var C={},cui={};
cands.forEach(function(c){pc(c.p).forEach(function(k){cui[k]=1});c.rows.forEach(function(r){(r.style||[]).forEach(function(k){cui[k]=1})})});
var keys={diet:GROUPS.diet,dish:GROUPS.dish,cui:Object.keys(cui),place:GROUPS.place};
cands.forEach(function(c){c.rows.forEach(function(r){for(var g in keys){if(!pass(c.p,r,A,g))continue;keys[g].forEach(function(k){if(dh(c.p,r,k))C[k]=(C[k]||0)+1})}})});
keys.cui=keys.cui.filter(function(k){return C[k]||state.f.indexOf(k)>=0}).sort(function(a,b){return (C[b]||0)-(C[a]||0)}).slice(0,12);
var B=$('shB');B.textContent='';
for(var g in keys){
if(!keys[g].length)continue;
B.appendChild(el('h3',null,L.g[g]));
var w=el('div','fcs');
keys[g].forEach(function(k){var on=state.f.indexOf(k)>=0,n=C[k]||0,b=el('button','fc');b.type='button';b.appendChild(el('span',null,fLabel(k)));b.appendChild(el('span','n',String(n)));b.setAttribute('aria-pressed',String(on));b.disabled=!on&&!n;b.onclick=function(){toggleF(k)};w.appendChild(b)});
B.appendChild(w);
}
var fb=$('fb');fb.textContent=L.filters+(state.f.length?' ('+state.f.length+')':'');fb.className='fbtn'+(state.f.length?' on':'');
var ac=$('act');ac.textContent='';ac.hidden=!state.f.length;
state.f.forEach(function(k){var b=el('button',null,fLabel(k)+' ×');b.type='button';b.onclick=function(){toggleF(k)};ac.appendChild(b)});
}
function openSheet(o){$('sheet').hidden=!o;$('bd').hidden=!o;$('fb').setAttribute('aria-expanded',String(o));document.body.classList.toggle('lock',o)}
function toggleLinks(){state.links=!state.links;store.set('links',state.links?'1':'0');$('linksL').hidden=!state.links;$('lt').setAttribute('aria-expanded',String(state.links))}
function renderDays(){
var n=$('days');n.textContent='';n.setAttribute('aria-label',L.dayNav);n.hidden=!days.length;
days.forEach(function(d){var b=el('button',null,d===today?L.today:dayLabel(d));b.type='button';b.setAttribute('aria-pressed',String(d===state.day));b.onclick=function(){state.day=d;renderDays();render()};n.appendChild(b)});
}
function renderDist(){
var n=$('dist');n.textContent='';n.setAttribute('aria-label',L.distLabel);
L.dist.forEach(function(x){var b=el('button',null,x[1]);b.type='button';b.setAttribute('aria-pressed',String(x[0]===state.dist));b.onclick=function(){state.dist=x[0];store.set('dist',String(x[0]));renderDist();render()};n.appendChild(b)});
}
var qi=$('q'),clr=$('clr'),tmr;
function setQuery(q,fromInput){state.q=q;store.set('q',q);if(!fromInput)qi.value=q;clr.hidden=!q;render()}
qi.addEventListener('input',function(){clearTimeout(tmr);tmr=setTimeout(function(){setQuery(qi.value,true)},150)});
clr.onclick=function(){setQuery('');qi.focus()};
$('help').onclick=function(){state.help=!state.help;this.setAttribute('aria-expanded',String(state.help));render()};
$('fb').onclick=function(){openSheet($('sheet').hidden)};
$('shX').onclick=function(){openSheet(false)};$('bd').onclick=function(){openSheet(false)};
$('shC').onclick=function(){state.f=[];store.set('f','[]');render()};
document.addEventListener('keydown',function(e){if(e.key==='Escape')openSheet(false)});
$('lt').onclick=toggleLinks;
Array.prototype.forEach.call($('lang').querySelectorAll('button'),function(b){b.onclick=function(){lang=b.dataset.l;L=T[lang];store.set('lang',lang);paint()}});

function paint(){
document.documentElement.lang=lang;
Array.prototype.forEach.call($('lang').querySelectorAll('button'),function(b){b.setAttribute('aria-pressed',String(b.dataset.l===lang));b.setAttribute('aria-label',b.dataset.l==='fi'?'Suomeksi':'In English')});
$('title').textContent=L.title;document.title=L.title;
$('sub').textContent=L.sub+(data.week?' · '+L.week+' '+data.week:'');
$('linksH').textContent=L.linksH;$('linksL').hidden=!state.links;$('lt').setAttribute('aria-expanded',String(state.links));
qi.placeholder=L.searchPh;qi.setAttribute('aria-label',L.search);qi.value=state.q;clr.hidden=!state.q;
clr.setAttribute('aria-label',L.clear);$('help').setAttribute('aria-label',L.helpBtn);
$('shT').textContent=L.filters;$('shC').textContent=L.clearF;$('shX').textContent=L.done;
var b=fmtBuilt(data.built),f=$('foot');f.textContent='';
f.appendChild(el('p',null,(b?L.built+' '+b+'. ':'')+L.footer));
f.appendChild(el('p',null,L.stars));
renderDays();renderDist();render();
}
paint();
})();
</script>
