<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keybinds</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f4f2; --panel: #ffffff; --ink: #1c1c1a; --muted: #6b6b66; --line: #d9d9d4;
    --cap: #ffffff; --cap-ink: #2a2a28; --cap-edge: #c9c9c3; --cap-free: #e8e8e4;
    --sel: #1c1c1a; --sel-ink: #ffffff; --down: #ffd84d;
    --c-move: #2f6fdd; --c-combat: #d8432f; --c-world: #e08a12; --c-comms: #7c4fd6; --c-ui: #5b6b7a; --c-other: #1f9d6a; --c-free: #1f9d6a;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1c; --ink: #ecebe6; --muted: #9a9a92; --line: #33332f;
      --cap: #2a2a27; --cap-ink: #e6e5df; --cap-edge: #3d3d38; --cap-free: #232320;
      --sel: #ffd84d; --sel-ink: #1c1c1a; --down: #ffd84d;
      --c-move: #6a9cff; --c-combat: #ff7a66; --c-world: #ffb23f; --c-comms: #b394ff; --c-ui: #98a8b8; --c-other: #4fd39a; --c-free: #4fd39a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: grid; grid-template-columns: 340px 1fr; grid-template-rows: 100vh; }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .bar h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  select, input[type=search] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  select { min-width: 200px; }
  input[type=search] { width: 220px; }
  .game { display: flex; flex-direction: column; gap: 3px; }
  .meta { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px; }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
  .toggles label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; background: var(--c); vertical-align: -1px; }
  .legend [data-cat] { cursor: pointer; user-select: none; }
  .legend [data-cat].off { opacity: .45; text-decoration: line-through; }
  .filter { margin-left: auto; }
  .list { overflow: auto; flex: 1; padding: 6px 0 20px; }
  .row { display: grid; grid-template-columns: 4px 1fr auto; gap: 10px; align-items: center; padding: 5px 16px 5px 12px; cursor: pointer; border-left: 4px solid transparent; }
  .row:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .row.sel { background: color-mix(in srgb, var(--sel) 14%, transparent); border-left-color: var(--sel); }
  .row .dot { width: 4px; height: 18px; border-radius: 2px; background: var(--c, var(--line)); }
  .row .name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sem { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .row.unbound .name { color: var(--muted); }
  .keys { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .kbd { font: 11px/1 var(--mono); padding: 4px 6px; border: 1px solid var(--cap-edge); border-bottom-width: 2px; border-radius: 4px; background: var(--cap); color: var(--cap-ink); white-space: nowrap; }
  .kbd.raw { color: var(--muted); border-style: dashed; }
  .group { padding: 12px 16px 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .stage { flex: 1; overflow: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; align-items: flex-start; }
  .board { width: 100%; max-width: 1400px; }
  svg { display: block; width: 100%; height: auto; }
  .status { padding: 8px 24px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; display: flex; gap: 18px; flex-wrap: wrap; }
  .status b { color: var(--ink); font-weight: 600; }

  /* keys */
  .key rect, .key path { fill: var(--cap); stroke: var(--cap-edge); stroke-width: 1; rx: 5; ry: 5; }
  .key text { fill: var(--cap-ink); font: 12px system-ui, sans-serif; pointer-events: none; }
  .key text.sub { font-size: 9px; fill: var(--muted); }
  .key text.act { font-size: 8.5px; fill: var(--c, var(--cap-ink)); }
  .key { cursor: pointer; }
  .key.bound rect, .key.bound path { stroke: var(--c); stroke-width: 1.5; fill: color-mix(in srgb, var(--c) 12%, var(--cap)); }
  .key.free rect, .key.free path { stroke: var(--c-free); stroke-dasharray: 3 3; fill: color-mix(in srgb, var(--c-free) 8%, var(--cap)); }
  .key.sel rect, .key.sel path { fill: var(--sel) !important; stroke: var(--sel); }
  .key.sel text { fill: var(--sel-ink) !important; }
  .key.down rect, .key.down path { fill: var(--down) !important; stroke: var(--down); }
  .key.down text { fill: #1c1c1a !important; }
  .key:hover rect, .key:hover path { stroke: var(--ink); }
  .label text { font: 11px system-ui, sans-serif; fill: var(--ink); }
  .label rect { fill: var(--panel); stroke: var(--c, var(--line)); stroke-width: 1; rx: 3; ry: 3; }
  .label line { stroke: var(--c, var(--muted)); stroke-width: 1.2; opacity: .8; }
  .label.sel rect { fill: var(--sel); }
  .label.sel text { fill: var(--sel-ink); }
  .mouse .body { fill: none; stroke: var(--cap-edge); stroke-width: 1.5; }
  .hint { color: var(--muted); font-size: 12px; }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } aside { order: 2; max-height: 45vh; border-right: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<aside>
  <div class="list" id="list"></div>
</aside>
<main>
  <div class="bar">
    <h1>Keybinds</h1>
    <div class="game">
      <select id="game"></select>
      <div class="meta" id="meta"></div>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="t-labels"> Labels with lines</label>
      <label><input type="checkbox" id="t-free"> Free keys</label>
      <label><input type="checkbox" id="t-caps"> Names on keys</label>
    </div>
    <div class="legend" id="legend"></div>
    <div class="filter"><input type="search" id="filter" placeholder="Filter actions or keys…"></div>
  </div>
  <div class="stage">
    <div class="board"><svg id="kb"></svg></div>
    <div class="board" style="max-width:150px"><svg id="mouse"></svg></div>
    <div class="hint">Click an action, click a key, or press a key on the real keyboard. Esc clears. The page holds the physical layout, so the key next to left Shift is <b>&lt;</b> whatever the game calls it. Bookmarkable: <code>?game=valheim&amp;labels=1&amp;free=1&amp;caps=1</code>.</div>
  </div>
  <div class="status" id="status"></div>
</main>

        // ISO enter: 1.5u wide on row 2, 1.25u on row 3, one shape
        const x2 = (x + 0.25) * U;
        el("path", { d: `M${px + R},${py} h${pw - 2 * R} a${R},${R} 0 0 1 ${R},${R} v${2 * U - GAP - 2 * R} a${R},${R} 0 0 1 -${R},${R} h-${(pw - (x2 - px)) - 2 * R} a${R},${R} 0 0 1 -${R},-${R} v-${U - 2 * R} a${R},${R} 0 0 1 ${R},-${R} h-${(x2 - px) - 2 * R} a${R},${R} 0 0 1 -${R},-${R} v-${ph - U - 2 * R + GAP} a${R},${R} 0 0 1 ${R},-${R} z` }, g);
        el("text", { x: px + 8, y: py + 16 }, g).textContent = "Enter";
        keyPos.set(name, { cx: px + pw * 0.6, cy: py + U, row: 2, top: py, bottom: py + 2 * U - GAP });
      } else {
        el("rect", { x: px, y: py, width: pw, height: ph, rx: R, ry: R }, g);
        const t = el("text", { x: px + 7, y: py + 16 }, g);
        t.textContent = legendOf(name);
        if (SHIFTED[name]) el("text", { x: px + pw - 6, y: py + 12, class: "sub", "text-anchor": "end" }, g).textContent = SHIFTED[name];
        el("text", { x: px + 6, y: py + ph - 5, class: "act" }, g);
        keyPos.set(name, { cx: px + pw / 2, cy: py + ph / 2, row: rowIndex, top: py, bottom: py + ph });
      }
      el("title", {}, g);
      keyEls.set(name, g);
      W = Math.max(W, px + pw); H = Math.max(H, py + ph);
    };
    MAIN.forEach((row, r) => { let x = 0; for (const [name, w] of row) { if (name) place(name, x, ROW_Y(r), w, 1, r); x += w; } });
    place("Enter", 13.5, ROW_Y(2), 1.5, 2, 2);
    for (const block of [NAV, NUMPAD]) block.rows.forEach((row, r) => { let x = block.x; for (const [name, w, h] of row) { if (name) place(name, x, ROW_Y(r), w, h || 1, r); x += w; } });
    el("g", { id: "labels" }, svg);
    svg.dataset.w = W; svg.dataset.h = H;
    svg.setAttribute("viewBox", `-2 -2 ${W + 4} ${H + 4}`);
    svg.addEventListener("click", e => { const g = e.target.closest(".key"); if (g) select({ type: "key", key: g.dataset.key }); });
  }

  function buildMouse() {
    msvg.setAttribute("viewBox", "0 0 120 200");
    const g = el("g", { class: "mouse" }, msvg);
    el("path", { class: "body", d: "M20,60 Q20,10 60,10 Q100,10 100,60 L100,150 Q100,190 60,190 Q20,190 20,150 Z" }, g);
    const btn = (name, d, tx, ty, label) => {
      const k = el("g", { class: "key", "data-key": name }, g);
      el("path", { d }, k);
      const t = el("text", { x: tx, y: ty, "text-anchor": "middle" }, k); t.textContent = label;
      el("text", { x: tx, y: ty + 12, class: "act", "text-anchor": "middle" }, k);
      el("title", {}, k);
      keyEls.set(name, k);
    };
    btn("Mouse1", "M22,62 Q22,14 52,12 L52,78 L22,78 Z", 37, 44, "1");
    btn("Mouse2", "M68,12 Q98,14 98,62 L98,78 L68,78 Z", 83, 44, "2");
    btn("Mouse3", "M55,30 h10 v40 h-10 z", 60, 52, "3");
    btn("WheelUp", "M55,14 h10 v14 h-10 z", 60, 24, "↑");
    btn("WheelDown", "M55,72 h10 v14 h-10 z", 60, 82, "↓");
    btn("Mouse4", "M8,92 h10 v26 h-10 z", 13, 108, "4");
    btn("Mouse5", "M8,124 h10 v26 h-10 z", 13, 140, "5");
    msvg.addEventListener("click", e => { const k = e.target.closest(".key"); if (k) select({ type: "key", key: k.dataset.key }); });
  }

  // ---- per game
  function loadGame(slug) {
    game = DATA.games.find(g => g.slug === slug) || DATA.games[0];
    keyToActions = new Map(); actionToKeys = new Map(); cats = new Map();
    for (const [action, toks] of Object.entries(game.bindings)) {
      const parsed = (toks || []).map(parseKey).filter(Boolean);
      actionToKeys.set(action, parsed);
      cats.set(action, category(game, action));
      parsed.forEach((p, slot) => { if (p.key) { if (!keyToActions.has(p.key)) keyToActions.set(p.key, []); keyToActions.get(p.key).push({ action, mods: p.mods, slot }); } });
    }
    selection = null;
    $("meta").textContent = game.store + (game.applied ? ` · ESDF applied ${game.applied}` : "") + (game.verified ? ` · verified ${game.verified}` : "");
    $("meta").title = $("meta").textContent;
    try { localStorage.setItem("keybinds.game", game.slug); } catch (e) {}
    renderList(); paintKeys(); renderLabels(); renderStatus();
  }

  function renderList() {
    const list = $("list"); list.innerHTML = "";
    const q = $("filter").value.trim().toLowerCase();
    const groups = new Map();
    for (const [action, keys] of actionToKeys) {
      const bound = keys.length > 0;
      const c = bound ? cats.get(action) : "unbound";
      if (hidden.has(c)) continue;
      const hay = (action + " " + keys.map(k => k.key ? prettyKey(k.key) + " " + k.key : k.raw).join(" ")).toLowerCase();
      if (q && !hay.includes(q)) continue;
      if (!groups.has(c)) groups.set(c, []);
      groups.get(c).push(action);
    }
    const order = ["move", "combat", "world", "comms", "ui", "other", "unbound"];
    for (const c of order) {
      const acts = groups.get(c); if (!acts) continue;
      const h = document.createElement("div"); h.className = "group"; h.textContent = c === "unbound" ? `Unbound (${acts.length})` : `${CAT_NAMES[c]} (${acts.length})`; list.appendChild(h);
      for (const action of acts) {
        const row = document.createElement("div"); row.className = "row" + (c === "unbound" ? " unbound" : ""); row.dataset.action = action;
        row.style.setProperty("--c", `var(--c-${c === "unbound" ? "ui" : c})`);
        const sem = game.actions?.[action]?.semantic;
        row.innerHTML = `<div class="dot"></div><div class="name" title="${action}">${action}${sem ? `<span class="sem">${sem}</span>` : ""}</div><div class="keys"></div>`;
        const kk = row.querySelector(".keys");
        for (const k of actionToKeys.get(action)) {
          const b = document.createElement("span"); b.className = "kbd" + (k.raw ? " raw" : "");
          b.textContent = k.raw ? k.raw : (k.mods.length ? k.mods.join("+") + "+" : "") + prettyKey(k.key);
          kk.appendChild(b);
        }
        row.addEventListener("click", () => select(selection?.type === "action" && selection.action === action ? null : { type: "action", action }));
        list.appendChild(row);
      }
    }
    applySelection();
  }

  function paintKeys() {
    for (const [name, g] of keyEls) {
      const acts = visibleActs(name);
      g.classList.toggle("bound", acts.length > 0);
      g.classList.toggle("free", opts.free && acts.length === 0 && !isModifierish(name));
      const c = acts.length ? cats.get(acts[0].action) : null;
      g.style.setProperty("--c", c ? `var(--c-${c})` : "");
      g.querySelector("title").textContent = acts.length ? `${prettyKey(name)} — ${acts.map(a => (a.mods.length ? a.mods.join("+") + "+" : "") + a.action).join(", ")}` : `${prettyKey(name)} — free`;
      const t = g.querySelector("text.act");
      if (t) t.textContent = opts.caps && acts.length ? fit(acts.map(a => a.action).join(" · "), name === "Space" ? 60 : keyWidth(name)) : "";
    }
  }
  const isModifierish = n => /Meta|ContextMenu|CapsLock|NumLock|PrintScreen|ScrollLock|Pause|Escape/.test(n);
  const keyWidth = n => { const r = keyEls.get(n)?.querySelector("rect"); return r ? Math.floor((+r.getAttribute("width") - 8) / 4.4) : 8; };
  const fit = (s, n) => s.length <= n ? s : s.slice(0, Math.max(1, n - 1)) + "…";

  function renderLabels() {
    const layer = $("labels"); layer.innerHTML = "";
    const W = +svg.dataset.w, H = +svg.dataset.h;
    if (!opts.labels) { svg.setAttribute("viewBox", `-2 -2 ${W + 4} ${H + 4}`); return; }
    const items = [];
    for (const name of keyToActions.keys()) {
      const p = keyPos.get(name), acts = visibleActs(name); if (!p || !acts.length) continue;
      items.push({ name, p, text: acts.map(a => (a.mods.length ? a.mods.join("+") + "+" : "") + a.action).join(" / "), zone: p.row <= 2 ? "top" : "bottom", c: cats.get(acts[0].action) });
    }
    const TIER = 24, PAD = 6;
    let minY = 0, maxY = H;
    for (const zone of ["top", "bottom"]) {
      const zs = items.filter(i => i.zone === zone).sort((a, b) => a.p.cx - b.p.cx);
      const tiers = [];
      for (const it of zs) {
        const g = el("g", { class: "label", "data-key": it.name }, layer);
        g.style.setProperty("--c", `var(--c-${it.c})`);
        const t = el("text", { x: 0, y: 0, "text-anchor": "middle", "dominant-baseline": "middle" }, g); t.textContent = it.text;
        const w = t.getBBox().width + 2 * PAD, half = w / 2;
        let x = Math.min(Math.max(it.p.cx, half), W - half);
        let tier = 0;
        while (tiers[tier] !== undefined && tiers[tier] > x - half - 4) tier++;
        tiers[tier] = x + half;
        const y = zone === "top" ? -14 - tier * TIER : H + 14 + tier * TIER;
        el("line", { x1: x, y1: y + (zone === "top" ? 9 : -9), x2: it.p.cx, y2: zone === "top" ? it.p.top + 2 : it.p.bottom - 2 }, g);
        g.insertBefore(el("rect", { x: x - half, y: y - 9, width: w, height: 18 }), t);
        t.setAttribute("x", x); t.setAttribute("y", y + 0.5);
        minY = Math.min(minY, y - 12); maxY = Math.max(maxY, y + 12);
        g.addEventListener("click", () => select({ type: "key", key: it.name }));
      }
    }
    svg.setAttribute("viewBox", `-2 ${minY - 2} ${W + 4} ${maxY - minY + 4}`);
    applySelection();
  }

  function renderStatus() {
    const all = [...keyEls.keys()].filter(k => !MOUSE_NAMES[k] && !isModifierish(k));
    const used = all.filter(k => visibleActs(k).length);
    const free = all.filter(k => !visibleActs(k).length);
    const bound = [...actionToKeys].filter(([a, v]) => v.length && visible(a)).length;
    const hid = hidden.size ? `<span>hidden: ${[...hidden].map(c => CAT_NAMES[c]).join(", ")}</span>` : "";
    $("status").innerHTML = `<span><b>${game.name}</b></span><span><b>${bound}</b> bound actions</span><span><b>${used.length}</b> keys in use</span>${hid}<span><b>${free.length}</b> free keys: ${free.map(prettyKey).join(" ")}</span>`;
  }

  function select(sel) {
    selection = sel;
    applySelection();
    if (sel?.type === "key") {
      const row = [...document.querySelectorAll(".row")].find(r => (keyToActions.get(sel.key) || []).some(a => a.action === r.dataset.action));
      row?.scrollIntoView({ block: "nearest" });
    } else if (sel?.type === "action") {
      document.querySelector(`.row[data-action="${CSS.escape(sel.action)}"]`)?.scrollIntoView({ block: "nearest" });
    }
  }
  function applySelection() {
    const keys = new Set(), actions = new Set();
    if (selection?.type === "key") { keys.add(selection.key); for (const a of keyToActions.get(selection.key) || []) actions.add(a.action); }
    if (selection?.type === "action") { actions.add(selection.action); for (const k of actionToKeys.get(selection.action) || []) if (k.key) keys.add(k.key); }
    for (const [name, g] of keyEls) g.classList.toggle("sel", keys.has(name));
    document.querySelectorAll("#labels .label").forEach(l => l.classList.toggle("sel", keys.has(l.dataset.key)));
    document.querySelectorAll(".row").forEach(r => r.classList.toggle("sel", actions.has(r.dataset.action)));
  }

  // ---- physical keyboard
  window.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") { if (e.key === "Escape") e.target.blur(); return; }
    if (e.key === "Escape") { select(null); keyEls.get("Escape")?.classList.add("down"); e.preventDefault(); return; }
    const k = codeToKey(e.code);
    if (!k || !keyEls.has(k)) return;
    keyEls.get(k).classList.add("down");
    if (!e.repeat) select({ type: "key", key: k });
    if (!e.ctrlKey && !e.metaKey) e.preventDefault();
  });
  window.addEventListener("keyup", e => { const k = codeToKey(e.code); if (k) keyEls.get(k)?.classList.remove("down"); });
  window.addEventListener("blur", () => keyEls.forEach(g => g.classList.remove("down")));

  function toggle(name, force) {
    opts[name] = force ?? !opts[name];
    $("t-" + name).checked = opts[name];
    try { localStorage.setItem("keybinds." + name, opts[name] ? "1" : "0"); } catch (e) {}
    paintKeys(); renderLabels();
  }
  const params = new URLSearchParams(location.search);   // ?game=valheim&labels=1&free=1&caps=1&hide=ui,other for bookmarks
  for (const n of ["labels", "free", "caps"]) {
    $("t-" + n).addEventListener("change", e => toggle(n, e.target.checked));
    try { if (localStorage.getItem("keybinds." + n) === "1") { opts[n] = true; } } catch (e) {}
    if (params.has(n)) opts[n] = params.get(n) === "1";
    $("t-" + n).checked = opts[n];
  }
  $("filter").addEventListener("input", renderList);
  $("legend").innerHTML = Object.entries(CAT_NAMES).map(([c, n]) => `<span data-cat="${c}" style="--c:var(--c-${c})" title="click to hide or show this category">${n}</span>`).join("") + `<span style="--c:var(--c-free)">Free (toggle)</span>`;
  try { (localStorage.getItem("keybinds.hide") || "").split(",").filter(Boolean).forEach(c => hidden.add(c)); } catch (e) {}
  if (params.has("hide")) { hidden.clear(); params.get("hide").split(",").filter(c => c in CAT_NAMES).forEach(c => hidden.add(c)); }
  const paintLegend = () => document.querySelectorAll("#legend [data-cat]").forEach(s => s.classList.toggle("off", hidden.has(s.dataset.cat)));
  paintLegend();
  $("legend").addEventListener("click", e => {
    const c = e.target.dataset?.cat; if (!c) return;
    hidden.has(c) ? hidden.delete(c) : hidden.add(c);
    try { localStorage.setItem("keybinds.hide", [...hidden].join(",")); } catch (e2) {}
    paintLegend(); renderList(); paintKeys(); renderLabels(); renderStatus();
  });

  // ---- boot
  buildKeyboard(); buildMouse();
  const sel = $("game");
  for (const g of DATA.games) { const o = document.createElement("option"); o.value = g.slug; o.textContent = g.name; sel.appendChild(o); }
  let start = DATA.games[0]?.slug; try { const s = localStorage.getItem("keybinds.game"); if (DATA.games.some(g => g.slug === s)) start = s; } catch (e) {}
  if (DATA.games.some(g => g.slug === params.get("game"))) start = params.get("game");
  sel.value = start;
  sel.addEventListener("change", () => loadGame(sel.value));
  loadGame(start);
  document.title = "Keybinds · " + DATA.generated.slice(0, 10);
})();
</script>
</body>
